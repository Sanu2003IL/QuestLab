'use strict';
const TRACKS=[{id:'python',name:'Python',sub:'Think in code',icon:'>_',color:'#6259ed',intro:'From your first program to reliable applications. Read, trace, run, test, then build.',prereq:'No programming experience required.'},{id:'math',name:'Math for AI',sub:'Make the abstract visible',icon:'∑',color:'#168a8c',intro:'Algebra, geometry, linear algebra, calculus, probability and optimization connected to learning algorithms.',prereq:'Start with algebra; Python helps when translating equations into code.'},{id:'ml',name:'Machine Learning',sub:'Learn from data',icon:'⠿',color:'#d07423',intro:'Design experiments, train baselines, compare models and measure generalization honestly.',prereq:'Python, arrays, derivatives and basic probability.'},{id:'ai',name:'AI Engineering',sub:'Build intelligent systems',icon:'✧',color:'#be4e8b',intro:'Search, neural networks, language models, retrieval, agents and responsible deployment.',prereq:'Python and ML foundations; matrix multiplication and the chain rule.'},{id:'gre',name:'GRE',sub:'Reason with confidence',icon:'G',color:'#39815f',intro:'Quantitative Reasoning, Verbal Reasoning and Analytical Writing, with original practice and timed sections.',prereq:'Basic school mathematics and English reading. Trigonometry and calculus belong to Math for AI, not GRE Quant.'}];
const LESSONS=[];
function lesson(track,module,title,concept,example,trap,question,choices,answer,why,lab='',code=''){const id=track+'-'+(LESSONS.filter(x=>x.track===track).length+1);LESSONS.push({id,track,module,title,concept,example,trap,question,choices,answer,why,lab,code,minutes:8+(LESSONS.length%4)*2});}
const P=(...x)=>lesson('python',...x), M=(...x)=>lesson('math',...x), ML=(...x)=>lesson('ml',...x), A=(...x)=>lesson('ai',...x), G=(...x)=>lesson('gre',...x);
P('01 · First principles','Programs, interpreters & your first output','A program is a precise sequence of instructions. Python reads source code, compiles it to bytecode and executes it in an interpreter. A script repeats a saved procedure; a REPL runs one piece at a time. Start by predicting output before running it.','print("Hello") sends text to standard output. In a terminal, python hello.py executes a saved file; in this app, Run executes the editor in browser Python.','Source code and output are different things. Quotation marks delimit text and are not normally printed.','What does print(2 + 3) display?',['2 + 3','5','23','Nothing'],1,'Python evaluates addition first, then prints the resulting integer.','trace','print("Hello, explorer!")\nprint(2 + 3)');
P('01 · First principles','Syntax, indentation & comments','Syntax is the grammar of a language. Python uses indentation to group statements. A colon opens a block after constructs such as if or for. Use four spaces per level consistently. Comments explain intent and start with # outside strings.','if 8 > 5: followed by an indented print("large") prints large. A comment such as # validate the score is ignored by execution.','Mixing tabs and spaces can produce an indentation error. Comments cannot repair invalid syntax.','Which line begins a Python comment?',['// explain','<!-- explain -->','# explain','/* explain */'],2,'A hash starts a comment outside a string.','trace','score = 8\nif score > 5:\n    # Celebrate the result\n    print("large")');
P('01 · First principles','Variables, references & types','A variable is a name bound to an object. Assignment evaluates the right side and binds the left name. Integers, floats, booleans, strings and None describe different values. Dynamic typing means a name can later refer to an object of a different type.','x = 7; y = x; x = 9 leaves y equal to 7. Rebinding x does not change the original integer. type(x) returns its type.','Names do not contain physical boxes of data. Aliasing matters for mutable objects such as lists.','After a = 4; b = a; a = 6, what is b?',['4','6','None','An error'],0,'b still refers to the integer 4; only a was rebound.','memory','a = 4\nb = a\na = 6\nprint(a, b)\nprint(type(a).__name__)');
P('01 · First principles','Numbers, operators & precision','Use +, -, *, /, //, %, and ** for arithmetic. / produces a float; // floors the quotient; % gives the remainder. Parentheses clarify precedence. Binary floats approximate many decimals, so compare computed floats using a tolerance when appropriate.','17 // 5 is 3 and 17 % 5 is 2, so 17 = 5 × 3 + 2. -7 // 3 is -3 because flooring moves toward negative infinity.','// does not truncate toward zero for negative values. 0.1 + 0.2 is not exactly 0.3 in binary floating point.','What is 2 + 3 ** 2?',['25','11','10','18'],1,'Exponentiation happens before addition: 3² = 9, then 2 + 9 = 11.','functions','import math\nprint(17 // 5, 17 % 5)\nprint(0.1 + 0.2)\nprint(math.isclose(0.1 + 0.2, 0.3))');
P('01 · First principles','Strings, slicing & formatting','A string is an immutable sequence of Unicode characters. Indexing starts at zero; negative indices count from the end. A slice [start:stop:step] excludes stop. Methods return new strings. f-strings insert expressions into readable text.','"Python"[1:4] is "yth". With price = 3.5, f"{price:.2f}" gives "3.50". len counts code points, which do not always match visible symbols.','You cannot assign text[0] = "A". Build a new string instead.','What is "Python"[-1]?',['P','n','o','An error'],1,'Index -1 selects the last character.','memory','word = "Python"\nprint(word[1:4])\nprint(word[::-1])\nprice = 3.5\nprint(f"Price: {price:.2f}")');
P('01 · First principles','Input, conversion & validation','input returns text. Convert only after deciding which values are allowed; int and float can raise ValueError. Separate reading, validating, computing and presenting. This makes interactive programs easier to test.','If text is "12", int(text) + 3 is 15, while text + "3" is "123". Strip surrounding spaces when appropriate. Browser input lines are supplied in the workspace input box.','Never use eval to parse untrusted input. Treat user input as data.','What does int("12") + 3 return?',['123','15','12.3','An error'],1,'int converts the text to an integer before numeric addition.','trace','text = input("Enter a whole number: ")\ntry:\n    print(int(text) + 3)\nexcept ValueError:\n    print("Please enter a whole number.")');
P('02 · Control & collections','Booleans, conditions & branching','Comparisons produce booleans. if, elif and else choose the first matching branch. and and or short-circuit, so later operands may not run. In conditions, empty collections, zero and None are falsey. Use explicit comparisons when they express intent better.','For age = 20, age >= 18 and age < 65 is true. Chained comparison 18 <= age < 65 expresses the same interval.','Use == for equality. is checks identity and is appropriate for tests such as value is None.','If x = 0, which expression is True?',['x > 1','bool(x)','x == 0','x is None'],2,'Zero compares equal to zero but is falsey in a boolean context.','trace','age = 20\nif 18 <= age < 65:\n    print("Adult ticket")\nelse:\n    print("Other ticket")');
P('02 · Control & collections','For loops, range & iteration','A for loop consumes items from an iterable. range(start, stop, step) represents an integer progression with an excluded stop. Track the changing variables on each iteration; loop invariants describe what remains true.','For n in range(1,4), n takes 1, 2 and 3. Adding n to total each time gives 6. enumerate gives both index and value.','range(5) produces 0 through 4, not 1 through 5. Avoid changing a list length while iterating over it.','What is sum(range(1, 4))?',['10','6','4','3'],1,'The values are 1, 2 and 3, whose sum is 6.','trace','total = 0\nfor n in range(1, 4):\n    total += n\n    print(n, total)');
P('02 · Control & collections','While loops, break & continue','while repeats as long as its condition stays truthy. Identify an initial state, a condition and a state update. break exits the nearest loop; continue skips the rest of its current iteration. Use while for a process whose iteration count is not known beforehand.','Starting at n = 3, printing n and reducing it by 1 while n > 0 prints 3, 2, 1. A missing update would keep the condition true forever.','A continue placed before the state update can accidentally create an infinite loop. The workspace Stop button terminates browser Python.','What does break do?',['Restart the program','Exit the nearest loop','Skip one expression only','Exit every enclosing function'],1,'break exits the nearest enclosing for or while loop.','trace','n = 3\nwhile n > 0:\n    print(n)\n    n -= 1');
P('02 · Control & collections','Lists, mutation & copying','Lists preserve order and can change. append adds one object; extend adds each item of an iterable. Multiple names can point to the same list. list.copy creates a shallow copy, so nested objects may still be shared.','a = [1,2]; b = a; b.append(3) also changes a. In contrast, c = a.copy(); c.append(4) changes only the outer copy.','[[0] * 3] * 2 repeats references to one inner list. Use a comprehension to make independent rows.','a=[1]; b=a; b.append(2). What is a?',['[1]','[1, 2]','[2]','None'],1,'a and b refer to the same mutable list.','memory','a = [1, 2]\nb = a\nb.append(3)\nc = a.copy()\nc.append(4)\nprint(a, b, c)');
P('02 · Control & collections','Tuples, sets & membership','Tuples are immutable sequences, useful for fixed records. Sets store unique hashable elements and support union, intersection and difference. Choose a container by the operations you need, not by habit. Hash-based membership is usually fast on average.','set([1,1,2]) has two elements. {1,2} & {2,3} is {2}. A one-item tuple needs a comma: (4,).','An empty set is set(); {} is an empty dictionary. A tuple can contain a mutable object even though its own references cannot be replaced.','What is len({1,1,2,3})?',['4','2','3','1'],2,'A set removes duplicate values, leaving 1, 2 and 3.','venn','a = {1, 2}\nb = {2, 3}\nprint(sorted(a | b))\nprint(sorted(a & b))');
P('02 · Control & collections','Dictionaries & counting patterns','A dictionary maps unique hashable keys to values. Use d[key] when a missing key is an error; d.get(key, default) when absence is expected. Iterate with items for key-value pairs. Counting is a repeated read-update-write operation.','For each word, counts[word] = counts.get(word, 0) + 1. A Counter from collections provides this pattern directly. Dictionaries preserve insertion order.','Checking key in d checks keys, not values. Mutable lists cannot be dictionary keys.','For d={"a":2}, what is d.get("b",0)?',['2','None','0','KeyError'],2,'The key is absent, so get returns the supplied default 0.','trace','from collections import Counter\nwords = "data code data".split()\ncounts = Counter(words)\nprint(dict(counts))');
P('02 · Control & collections','Comprehensions & transformations','A comprehension describes a new collection through iteration, optional filtering and an output expression. Use a loop when control flow or side effects become complex. Read comprehensions in execution order: for, if, expression.','[x*x for x in range(5) if x % 2 == 0] gives [0,4,16]. A generator expression uses parentheses and computes values lazily.','Do not use a comprehension only for side effects. Large nested comprehensions are harder to inspect than named steps.','What is [x*2 for x in [1,3]]?',['[1,3,1,3]','[2,6]','[2,3]','[1,6]'],1,'The expression doubles each item independently.','trace','squares = [x*x for x in range(5) if x % 2 == 0]\nprint(squares)');
P('03 · Reusable programs','Functions, return & scope','A function gives a name to a reusable computation. Parameters are local names; arguments supply their values. return sends a value to the caller and ends the function. Without an explicit return, the result is None. Favor small functions with clear inputs and outputs.','def add(a,b): return a+b computes a reusable result. print(add(2,3)) displays 5; printing inside add would not automatically return that number.','print and return are different. Avoid unnecessary global state, which makes tests depend on execution history.','A function finishes without return. Its result is…',['0','An empty string','None','Undefined syntax'],2,'Python functions implicitly return None when execution reaches the end.','stack','def add(a, b):\n    return a + b\n\nresult = add(2, 3)\nprint(result)');
P('03 · Reusable programs','Arguments, defaults & unpacking','Functions accept positional and keyword arguments. *args collects extra positional arguments; **kwargs collects extra keyword arguments. Defaults are evaluated once when the function is defined. Use None as a sentinel when each call needs a fresh mutable object.','def collect(item, items=None): create items=[] when items is None, then append. Calling with **{"name":"Ada"} unpacks a dictionary as keywords.','A default like items=[] is shared between calls, a frequent source of surprising state.','Why can a default list be risky?',['Lists cannot be parameters','It is reused across calls','It is always copied','It makes functions recursive'],1,'The default object is created once at definition time.','memory','def collect(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\nprint(collect(1), collect(2))');
P('03 · Reusable programs','Recursion & the call stack','A recursive function calls itself on a smaller instance. It needs a base case and progress toward that case. Each call has its own local state on the call stack. Recursion fits trees and divide-and-conquer, but deep Python recursion is limited.','factorial(3) waits for factorial(2), which waits for factorial(1). The returns unwind as 1, 2 and 6. Iteration can compute factorial with less stack space.','Missing a base case or moving away from it leads to recursion errors. Python does not optimize tail recursion away.','For factorial(0), the conventional result is…',['0','1','Undefined','-1'],1,'The empty product is 1, making n! = n × (n−1)! consistent.','stack','def factorial(n):\n    if n < 0:\n        raise ValueError("n must be nonnegative")\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\nprint(factorial(5))');
P('03 · Reusable programs','Modules, packages & environments','A module is an importable unit, often one .py file. A package organizes modules. A virtual environment isolates dependencies for a project; record versions so another person can reproduce it. The standard library comes with Python, while third-party packages need installation.','On a computer, python -m venv .venv creates an environment. python -m pip install package installs using that interpreter. Browser Python uses its own supported package loader.','Do not name a file math.py if you intend to import the standard math module. Shell commands are not Python source.','Which isolates a project’s installed dependencies?',['A comment','A virtual environment','A for loop','A tuple'],1,'A virtual environment gives a project a separate installation context.','','import math\nprint(math.sqrt(81))\nprint(math.pi)');
P('03 · Reusable programs','Exceptions, debugging & logging','Exceptions report failures and unwind the call stack until handled. Catch the specific errors you can recover from. Read the traceback from the final message back to the relevant frame. Reduce the failing input, inspect state and test your proposed fix. Logging records events without hiding failures.','int("oops") raises ValueError. A try/except ValueError can display a helpful message. finally executes cleanup whether an exception occurs or not.','A bare except can swallow cancellation and hide bugs. Do not confuse a syntax error with a runtime exception.','Which exception usually results from int("cat")?',['KeyError','ValueError','IndexError','NameError'],1,'The argument has the right broad type, but its contents are not a valid integer representation.','trace','for text in ["12", "cat"]:\n    try:\n        print(int(text))\n    except ValueError as error:\n        print(type(error).__name__)');
P('04 · Data & software design','Files, paths, CSV & JSON','Files hold persistent bytes; text files decode those bytes with an encoding. with closes files reliably. pathlib expresses paths portably. CSV represents rows; JSON represents structured numbers, strings, booleans, lists, objects and null. Validate loaded data before trusting its shape.','json.dumps({"score":7}) creates JSON text, and json.loads restores a dictionary. In browser Python, files live in a temporary virtual filesystem; use app exports for lasting downloads.','Never load untrusted pickle data: deserialization can execute code. Relative paths depend on the current working directory.','What does json.loads do?',['Writes a CSV','Parses JSON text','Installs a package','Encrypts a dictionary'],1,'loads converts a JSON string into Python data.','','import json\nfrom pathlib import Path\np = Path("scores.json")\np.write_text(json.dumps({"score": 7}), encoding="utf-8")\nprint(json.loads(p.read_text(encoding="utf-8")))');
P('04 · Data & software design','Classes, objects & encapsulation','A class defines behavior for instances. __init__ initializes new instances, and self refers to the instance receiving a method call. Store per-object state on self. Encapsulation groups behavior with the data whose rules it protects.','A Counter class can keep self.value and expose increment(). Two Counter() calls create independent instances if value is initialized on self.','A mutable class attribute is shared across instances unless shadowed. An underscore signals a convention, not strict privacy.','Where should independent per-instance balance usually be set?',['self.balance in __init__','A shared list at class level','A global variable','In a comment'],0,'An instance attribute holds that individual object’s state.','memory','class Counter:\n    def __init__(self):\n        self.value = 0\n    def increment(self):\n        self.value += 1\nc = Counter()\nc.increment()\nprint(c.value)');
P('04 · Data & software design','Inheritance, composition & protocols','Inheritance models substitutable behavior through a base class. Composition builds an object from collaborating objects. Duck typing focuses on supported operations. A protocol describes a structural interface for type checking without requiring inheritance.','A report can receive a storage object with a save method. In tests, substitute a small in-memory storage object. The report needs behavior, not a particular concrete storage class.','Avoid deep inheritance trees used only to reuse a few lines. Prefer the smallest interface that a caller actually needs.','Which is composition?',['Car contains an Engine','Car is an Engine','Every function is a class','A list is a comment'],0,'A has-a relationship combines collaborating components.','','class Engine:\n    def start(self):\n        return "running"\nclass Car:\n    def __init__(self, engine):\n        self.engine = engine\nprint(Car(Engine()).engine.start())');
P('04 · Data & software design','Dataclasses, typing & immutable records','Type hints communicate intent and support static analysis; Python usually does not enforce them at runtime. A dataclass generates common record methods. frozen=True prevents normal field reassignment but does not recursively freeze nested mutable objects.','@dataclass class Point: x: float; y: float creates a constructor and readable representation. A function annotated -> float can still return the wrong type unless tooling or tests catches it.','Do not assume annotations validate external data. Perform explicit checks at system boundaries.','Do ordinary type hints enforce types at runtime?',['Always','Usually not','Only for strings','They prevent imports'],1,'They are primarily metadata for tools and readers.','','from dataclasses import dataclass\n@dataclass(frozen=True)\nclass Point:\n    x: float\n    y: float\nprint(Point(2.0, 3.0))');
P('04 · Data & software design','Iterators, generators & laziness','An iterable can provide an iterator; an iterator provides one item at a time and eventually raises StopIteration. A generator uses yield to suspend and resume its frame. Lazy processing reduces peak memory when the full result is not needed at once.','(x*x for x in range(1000000)) produces squares on demand. Calling next twice returns 0 then 1. A consumed generator does not automatically restart.','sum consumes a generator. Trying to iterate it again may produce no items.','Which keyword creates a generator function?',['return alone','yield','global','class'],1,'A function containing yield produces a generator when called.','trace','def squares(n):\n    for x in range(n):\n        yield x*x\ng = squares(4)\nprint(next(g))\nprint(list(g))');
P('04 · Data & software design','Closures, decorators & context managers','A closure remembers names from an enclosing function. A decorator transforms or wraps a callable. A context manager provides entry and guaranteed exit behavior for a with block. These patterns separate repeated concerns such as timing, resource cleanup and instrumentation.','@decorator above a function is roughly function = decorator(function). functools.wraps preserves useful function metadata on a wrapper. contextlib.contextmanager builds a context manager from a generator.','A wrapper must return the wrapped result when callers expect it. Do not silently alter argument or error behavior.','A decorator most commonly…',['Wraps or transforms a function','Deletes every local name','Changes Python syntax','Replaces a virtual environment'],0,'Decorators operate on callable or class objects at definition time.','','from functools import wraps\ndef announce(fn):\n    @wraps(fn)\n    def wrapped(*args, **kwargs):\n        print("Calling", fn.__name__)\n        return fn(*args, **kwargs)\n    return wrapped\n@announce\ndef double(x):\n    return 2*x\nprint(double(4))');
P('05 · Engineering practice','Testing, assertions & edge cases','Tests compare actual behavior with expected behavior. Cover ordinary inputs, boundaries and invalid inputs. Unit tests isolate small behavior; integration tests check collaboration. A regression test records a past bug. Assertions are useful in tests, but should not be your only external-input validation.','For average(values), test one value, several values and an empty list. Decide the empty-list contract explicitly instead of allowing accidental behavior.','A passing test is evidence for its checked cases, not a proof of correctness for every input.','Which is a useful boundary test for first(items)?',['Only a 100-item list','An empty list','Changing the font','Reordering imports'],1,'Empty input tests the boundary where accessing index zero is invalid.','','def average(values):\n    if not values:\n        raise ValueError("empty data")\n    return sum(values) / len(values)\nassert average([2, 4]) == 3\nassert average([7]) == 7\nprint("2 tests passed")');
P('05 · Engineering practice','Algorithms, Big O & binary search','Complexity describes how resource use grows with input size. Linear scanning is O(n); binary search on sorted random-access data is O(log n). Distinguish worst-case, average-case and amortized costs. Measure real bottlenecks before optimizing.','Binary search compares with the middle item, then discards half the remaining interval. With about 1024 items, roughly 10 halvings reduce the interval to one.','Binary search requires sorted data and consistent comparisons. Sorting first has its own cost.','Binary search normally requires…',['A sorted search space','Only negative numbers','A dictionary of pictures','O(n²) extra memory'],0,'The ordering tells you which half can be discarded.','sort','from bisect import bisect_left\nvalues = [2, 4, 7, 9, 11]\ni = bisect_left(values, 7)\nprint(i, values[i])');
P('05 · Engineering practice','Stacks, queues, heaps & graphs','Stacks are last-in-first-out; queues are first-in-first-out. deque supports efficient operations at both ends. A heap supports retrieving the smallest-priority item. Graphs represent entities and relationships, often using adjacency lists. Choose structures to match access patterns.','A breadth-first search puts the start in a queue and visits neighbors level by level. A visited set prevents repeatedly exploring cycles.','Removing the first item of a Python list shifts remaining items. Use deque.popleft for frequent queue operations.','Which structure is natural for breadth-first search?',['A FIFO queue','Only a call stack','A single boolean','A sorted string'],0,'BFS processes earlier-discovered nodes before deeper ones.','search','from collections import deque\ngraph = {"A": ["B", "C"], "B": ["D"], "C": [], "D": []}\nq = deque(["A"])\nseen = {"A"}\nwhile q:\n    node = q.popleft()\n    print(node)\n    for nxt in graph[node]:\n        if nxt not in seen:\n            seen.add(nxt)\n            q.append(nxt)');
P('05 · Engineering practice','Regular expressions & text pipelines','Regex describes text patterns. Use raw string literals to avoid accidental Python escape processing. Match, search and fullmatch answer different questions. Prefer simple string operations for simple tasks, and compile readable patterns when reused.','re.findall(r"\\d+", "item 12 costs 35") finds digit runs. A text pipeline can normalize whitespace, split tokens, validate fields and report invalid rows separately.','A permissive pattern is not complete semantic validation. Poorly designed regex can take excessive time on adversarial input.','Which checks that the entire string matches?',['re.search','re.fullmatch','str.append','re.random'],1,'fullmatch requires the complete string to satisfy the pattern.','','import re\ntext = "item 12 costs 35"\nprint(re.findall(r"\\d+", text))');
P('05 · Engineering practice','APIs, HTTP & database boundaries','An API defines how components communicate. HTTP clients send methods, headers and bodies and interpret status codes. Use timeouts and bounded retries for transient failures. Databases store structured records; parameterized SQL separates code from data. Browser networking is also constrained by CORS.','A SQLite query SELECT name FROM people WHERE id = ? with a separate parameter prevents the value from becoming executable SQL. Commit related writes together when atomicity matters.','Do not concatenate untrusted text into SQL or put secret API keys in a public HTML file.','What helps prevent SQL injection?',['Concatenating user input','Parameterized queries','Shorter table names','Printing the query'],1,'Parameters send values separately from SQL structure.','','import sqlite3\ncon = sqlite3.connect(":memory:")\ncon.execute("CREATE TABLE scores (name TEXT, points INTEGER)")\ncon.execute("INSERT INTO scores VALUES (?, ?)", ("Ada", 9))\nprint(con.execute("SELECT * FROM scores").fetchall())');
P('05 · Engineering practice','Async, concurrency & parallelism','Concurrency lets tasks make overlapping progress; parallelism runs work simultaneously. asyncio cooperatively switches when code awaits. It suits many I/O-bound tasks. CPU-heavy work may need processes or native vectorized operations, depending on interpreter and libraries.','Two awaited network requests can overlap their waiting time with gather. A CPU loop without awaits still blocks an event loop. Browser Python and desktop Python have different process capabilities.','async def does not make CPU computation automatically faster. Avoid blocking synchronous I/O inside the event loop.','asyncio is especially useful for…',['Many waiting I/O operations','Automatically accelerating every loop','Eliminating all race conditions','Compiling HTML'],0,'Cooperative scheduling uses idle waiting time to advance other tasks.','','import asyncio\nasync def task(n):\n    await asyncio.sleep(0.01)\n    return n*n\nprint(await asyncio.gather(task(2), task(3)))');
P('06 · Python for data','NumPy arrays, shapes & broadcasting','NumPy stores homogeneous multidimensional arrays and executes many operations in optimized native code. Shape describes axis lengths. Broadcasting aligns dimensions from the right; they must match or one must be 1. @ performs matrix multiplication, while * is elementwise multiplication.','An array of shape (3,2) plus a vector of shape (2,) adds the vector to each row. (3,2) @ (2,4) produces shape (3,4).','A slice can be a view sharing underlying data. Know when a copy is needed.','What is the shape of (3,2) @ (2,4)?',['(3,4)','(2,2)','(3,2,4)','Invalid'],0,'The inner dimensions match and are summed over; the outer dimensions remain.','matrix','import numpy as np\na = np.array([[1, 2], [3, 4], [5, 6]])\nprint(a + np.array([10, 20]))\nprint(a.shape)');
P('06 · Python for data','Pandas, missing data & joins','A DataFrame represents labeled tabular data. Inspect types, missingness, duplicates and units before analysis. groupby aggregates by keys; merge combines tables using a relationship. Fit any learned preprocessing using training data only when building models.','Group sales by region, sum revenue, and check whether missing revenue should be excluded, imputed or flagged. A many-to-many join can multiply row counts.','A join key is not necessarily unique. Check merge cardinality and avoid interpreting missing as zero without justification.','Why check row count after a merge?',['To detect unintended row multiplication','To change Python version','To guarantee causality','To sort all columns'],0,'Repeated keys on both sides can create combinations and inflate totals.','','import pandas as pd\ndf = pd.DataFrame({"region": ["N", "S", "N"], "sales": [12, 8, 10]})\nprint(df.groupby("region")["sales"].sum())');
P('06 · Python for data','Visualization, reproducibility & packaging','A useful plot matches a question: lines for ordered change, scatter for relationships and bars for category comparison. Label units and scales. Reproducible work records data provenance, transformations, environment and random seeds. A package separates reusable logic from entry points.','A reproducible experiment stores the split seed and preprocessing settings with results. A scatterplot may reveal a nonlinear relationship hidden by a single summary statistic.','Fixing a seed helps repeatability but does not guarantee validity or portability across all hardware and versions.','Which best supports reproducing an experiment?',['Only its final chart','Data version, code, environment and settings','A larger font','Deleting intermediate decisions'],1,'Reproduction needs the ingredients and procedure, not only the result.','regression','import random\nrng = random.Random(42)\nprint([rng.randint(1, 6) for _ in range(5)])');
P('06 · Python for data','Capstone: a tested data application','Combine the foundations into a small application with a clear contract. Read a CSV, validate rows, calculate summaries, save JSON and test the core functions. Separate domain logic from input/output so calculations can run in a terminal, web service or test.','Build a study tracker: fields are date, subject and minutes. Reject negative minutes, aggregate totals by subject and export a report. Keep a count of rejected records with reasons.','A project is not finished when it runs once. Include edge-case tests, a README and a reproducible sample dataset.','Where should aggregation logic ideally live?',['Only inside input prompts','In a testable function','Inside a secret string','In a screenshot'],1,'A pure or nearly pure function is easier to reuse and test.','','def totals_by_subject(rows):\n    totals = {}\n    for subject, minutes in rows:\n        if minutes < 0:\n            raise ValueError("minutes must be nonnegative")\n        totals[subject] = totals.get(subject, 0) + minutes\n    return totals\nassert totals_by_subject([("Python", 20), ("Python", 10)]) == {"Python": 30}\nprint(totals_by_subject([("Python", 20), ("Math", 15)]))');
M('01 · Algebra & geometry','Expressions, equations & functions','An expression produces a value; an equation asserts equality; a function assigns one output to each allowed input. Algebra lets you isolate unknowns while preserving equality. Domain restrictions matter when dividing, taking roots or applying logarithms.','For 3x + 4 = 19, subtract 4 on both sides and divide by 3 to get x = 5. For f(x)=2x+1, f(3)=7. Think of a function as an input-output rule.','Dividing by x assumes x is not zero. Squaring both sides may introduce extraneous solutions.','Solve 3x + 4 = 19.',['3','4','5','6'],2,'3x = 15, so x = 5.','functions');
M('01 · Algebra & geometry','Exponents, roots & logarithms','Exponentiation represents repeated multiplication and its extensions. A logarithm reverses exponentiation: log_b(a)=c means b^c=a, with b>0, b≠1 and a>0. Logarithms turn products into sums, which helps handle very small probabilities.','2³=8, so log₂8=3. ln(ab)=ln a+ln b for positive a,b. In ML, negative log likelihood turns maximizing a probability into minimizing an additive loss.','log(a+b) is not log(a)+log(b). Keep track of the logarithm base.','What is log₂(32)?',['4','5','8','16'],1,'2⁵=32.','functions');
M('01 · Algebra & geometry','Coordinate geometry & distance','A point in two dimensions has coordinates (x,y). Subtract coordinates to get a displacement. Euclidean distance comes from the Pythagorean theorem. A line y=mx+b has slope m and vertical intercept b. Distance notions become modeling choices in ML.','From (1,2) to (4,6), displacement is (3,4) and distance is √(9+16)=5. The slope is 4/3.','A vertical line has undefined slope. Features with different units can dominate distances without scaling.','Distance from (0,0) to (3,4)?',['7','1','5','25'],2,'√(3²+4²)=5.','vectors');
M('01 · Algebra & geometry','Triangles, area & similarity','Triangle angles sum to 180° in Euclidean geometry. Similar triangles have equal corresponding angles and proportional sides. For a right triangle a²+b²=c². Area is half base times perpendicular height. Similarity connects shapes without requiring equal size.','A 3-4-5 right triangle scaled by 2 becomes 6-8-10. Lengths double, areas multiply by 4 and volumes by 8.','The hypotenuse is opposite the right angle. An oblique side is not necessarily the perpendicular height.','A shape’s lengths triple. Its area scales by…',['3','6','9','27'],2,'Area contains two length dimensions, so the factor is 3².','geometry');
M('01 · Algebra & geometry','Trigonometry & the unit circle','On the unit circle, an angle θ identifies the point (cos θ, sin θ). Radians measure arc length divided by radius; π radians is 180°. sin²θ+cos²θ=1 follows from the circle equation. Trigonometry describes rotation, waves and positional features.','At 90° or π/2, the point is (0,1). For a right triangle, sin is opposite/hypotenuse and cos is adjacent/hypotenuse.','Most programming math functions expect radians, not degrees. Trigonometry is in this AI math path, not a GRE Quant requirement.','sin(π/2) equals…',['0','1','-1','π'],1,'The unit-circle point at a quarter turn has y-coordinate 1.','trig');
M('01 · Algebra & geometry','Sequences, sums & growth','A sequence orders values. Arithmetic sequences add a fixed difference; geometric sequences multiply by a fixed ratio. Sigma notation compresses a sum. Growth rates explain computational cost, compound change and learning schedules.','1+2+…+n = n(n+1)/2. For n=5 this is 15. A geometric sequence 3,6,12,24 doubles each step.','The number of terms and the last index may differ when indexing starts at zero.','1 + 2 + 3 + 4 + 5 = ?',['10','12','15','20'],2,'Pair the first and last terms, or use 5×6/2.','functions');
M('02 · Linear algebra','Vectors, magnitude & addition','A vector encodes direction and magnitude or an ordered collection of features. Add vectors component by component and scale by multiplying each component. Euclidean norm is the square root of the sum of squared components. The same algebra works in high dimensions.','(2,1)+(1,3)=(3,4), whose norm is 5. Geometrically, translate the second arrow to the first arrow’s tip.','Coordinates depend on a chosen basis; a vector is not just the ink of an arrow.','(2,1)+(1,3) equals…',['(3,4)','(2,3)','(1,2)','(3,3)'],0,'Add corresponding components.','vectors');
M('02 · Linear algebra','Dot products, angles & projections','The dot product sums pairwise coordinate products. It also equals ||a|| ||b|| cosθ. It measures alignment, computes weighted sums and underlies linear models. Projection onto a unit vector u is (v·u)u. Cosine similarity ignores magnitude.','(2,1)·(1,3)=2+3=5. Perpendicular nonzero vectors have dot product zero. A linear prediction w·x+b is a dot product plus an intercept.','A dot product is a scalar. Zero vectors have no defined cosine similarity without a convention.','(1,0)·(0,1) equals…',['0','1','2','-1'],0,'The vectors are perpendicular and each component product is zero.','dot');
M('02 · Linear algebra','Matrices & linear transformations','A matrix describes a linear map once bases are chosen. Its columns show where basis vectors go. Matrix-vector multiplication forms a weighted combination of columns. Composing transformations multiplies matrices, with the rightmost map acting first.','[[2,0],[0,1]] stretches horizontal coordinates by 2. Applied to (1,3), it gives (2,3). A 90° rotation uses [[0,-1],[1,0]].','Matrix multiplication is generally not commutative: AB may differ from BA.','[[2,0],[0,1]] times (1,3) is…',['(2,3)','(1,6)','(3,3)','(2,6)'],0,'The first coordinate doubles and the second is unchanged.','matrix');
M('02 · Linear algebra','Systems, rank, determinants & inverses','Ax=b asks which input produces b. Rank counts independent column directions. A square matrix with nonzero determinant is invertible. The determinant is signed volume scaling. Singular systems may have no solution or many; an inverse is not the right tool for every problem.','For A=[[2,0],[0,3]], det(A)=6 and A⁻¹=[[1/2,0],[0,1/3]]. If one row is a multiple of another, rank drops.','In numeric work, solve a linear system with a solver rather than explicitly computing an inverse.','A square matrix with determinant 0 is…',['Always invertible','Singular','The identity','Always all zeros'],1,'Zero determinant means the map collapses volume and has no full inverse.','matrix');
M('02 · Linear algebra','Eigenvectors & eigenvalues','An eigenvector is a nonzero direction preserved by a square linear map: Av=λv. The eigenvalue λ tells how that direction is scaled, possibly reversing it. Symmetric real matrices admit orthogonal eigenvectors, a key fact in covariance analysis.','For diag(3,1), horizontal vectors scale by 3 and vertical vectors by 1. Those axes are eigenvector directions. Most other vectors change direction.','The zero vector is excluded. Some real matrices have no real eigenvectors and need complex values.','For A=diag(3,1), the eigenvalue of (1,0) is…',['0','1','3','4'],2,'A(1,0)=(3,0)=3(1,0).','eigen');
M('02 · Linear algebra','SVD, PCA & low-rank approximation','SVD factorizes a matrix into orthogonal directions and nonnegative singular values: A=UΣVᵀ. PCA finds directions of maximum variance in centered data. Keeping a few leading components compresses data but may discard information relevant to the target.','If a point cloud is elongated along a diagonal, its first principal component follows that diagonal. Projecting onto it gives one coordinate per sample.','PCA is unsupervised: maximum variance is not the same as maximum predictive usefulness. Fit centering and components on training data.','PCA’s first component maximizes…',['Label accuracy by definition','Projected variance','The number of classes','The sample count'],1,'PCA chooses an orthogonal direction with maximum variance in centered data.','pca');
M('03 · Calculus & optimization','Limits & continuity','A limit describes what a function approaches as its input approaches a point, even if the value at that point is absent. Continuity requires the limit to equal the function value. Limits make precise the intuition behind instantaneous rates and accumulated area.','For x≠1, (x²−1)/(x−1)=x+1. As x approaches 1, the expression approaches 2 even though the original fraction is undefined at 1.','Substituting directly into 0/0 does not establish the limit. Simplification may apply only away from the point.','lim as x→1 of (x²−1)/(x−1) is…',['0','1','2','Undefined because 0/0'],2,'Factor the numerator and cancel x−1 for x≠1, then take the limit of x+1.','derivative');
M('03 · Calculus & optimization','Derivatives & tangent slopes','The derivative is an instantaneous rate of change: f′(x)=lim[h→0](f(x+h)−f(x))/h. It is the slope of the tangent line. For xⁿ, the derivative is nxⁿ⁻¹. A small change Δx gives an approximate output change f′(x)Δx.','For f(x)=x², f′(x)=2x. At x=3 the slope is 6, so increasing x by 0.01 increases f by about 0.06.','A derivative can be negative. A zero derivative alone does not prove a minimum.','The derivative of x² at x=3 is…',['3','6','9','2'],1,'f′(x)=2x; substituting 3 gives 6.','derivative');
M('03 · Calculus & optimization','Chain rule & computational graphs','The chain rule differentiates a composition: d f(g(x))/dx=f′(g(x))g′(x). A computational graph breaks a calculation into simple operations. Backpropagation multiplies local derivatives along paths and sums contributions when paths merge.','For y=(3x+1)², the outer derivative is 2(3x+1) and the inner derivative is 3, giving dy/dx=6(3x+1).','Do not forget the derivative of the inner function. Shared variables can contribute through several paths.','d/dx of (3x+1)² is…',['2(3x+1)','6(3x+1)','3x²','6x'],1,'Apply the outer square derivative and multiply by the inner derivative 3.','network');
M('03 · Calculus & optimization','Partial derivatives, gradients & Jacobians','A partial derivative varies one input while holding the others fixed. The gradient collects partials of a scalar function and points toward steepest local increase under Euclidean distance. The Jacobian collects derivatives for a vector-valued function.','For L(x,y)=x²+3y², ∇L=(2x,6y). At (1,2), the gradient is (2,12); a small step in its negative direction reduces L.','The gradient depends on feature scale. Steepest direction refers to a chosen geometry.','For f=x²+y² at (1,2), ∇f is…',['(1,2)','(2,4)','(2,2)','(4,2)'],1,'The partial derivatives are 2x and 2y.','surface');
M('03 · Calculus & optimization','Integrals & numerical accumulation','A definite integral accumulates signed area or a continuously varying quantity. Riemann sums approximate it using thin rectangles. The fundamental theorem links integrals with antiderivatives. Numerical methods approximate integrals when a closed form is unavailable.','∫₀² x dx=[x²/2]₀²=2. Midpoint rectangles usually improve as their widths decrease for well-behaved functions.','Area below the horizontal axis contributes negatively to a signed integral. Probability densities integrate over intervals, not single points.','∫₀² x dx equals…',['1','2','4','8'],1,'The region is a triangle with base 2 and height 2: area 2.','integral');
M('03 · Calculus & optimization','Gradient descent & learning rate','Gradient descent updates parameters opposite the gradient: θ←θ−η∇L(θ). The learning rate η controls step size. Too large a rate can oscillate or diverge; too small can be slow. Stochastic and mini-batch methods estimate gradients from subsets of data.','For L(w)=(w−3)², at w=0 the derivative is −6. With η=0.1, the new w is 0−0.1(−6)=0.6.','A smaller training loss does not automatically mean better generalization. Track validation performance separately.','Starting w=0, gradient=−6 and η=.1, the next w is…',['−.6','.6','6','−6'],1,'Subtract the learning rate times the gradient.','gradient');
M('03 · Calculus & optimization','Convexity, Hessians & constraints','A convex objective has no nonglobal local minima, although a minimizer need not exist or be unique. A Hessian collects second derivatives and describes local curvature. Constrained optimization restricts feasible solutions; Lagrange multipliers combine the objective and equality constraints under suitable conditions.','L(w)=w² is convex with second derivative 2. At w=0, its gradient is zero and curvature is positive. A flat or saddle point requires more analysis than a first derivative check.','Neural-network objectives are generally nonconvex. Positive curvature at one point does not prove global convexity.','For L(w)=w², the second derivative is…',['0','1','2','2w'],2,'Differentiate 2w once more to obtain 2.','surface');
M('04 · Probability & statistics','Sets, counting & combinatorics','The multiplication rule counts sequential choices. Permutations count ordered arrangements; combinations count unordered selections. A sample space contains possible outcomes. Use set union and intersection to reason about overlapping events without double counting.','Choosing 2 people from 5 gives C(5,2)=5!/(2!3!)=10. Assigning distinct first and second places gives 5×4=20.','Do not use a combination formula when order matters. Equally described outcomes are not automatically equally likely.','How many unordered pairs can be chosen from 5 people?',['5','10','20','25'],1,'5×4 counts each pair twice, so divide by 2.','venn');
M('04 · Probability & statistics','Conditional probability & Bayes','Conditional probability updates the sample space: P(A|B)=P(A∩B)/P(B). Bayes reverses the direction: P(A|B)=P(B|A)P(A)/P(B). The prior and false-positive rate can strongly affect the posterior when an event is rare.','If prevalence is 1%, sensitivity 90% and false-positive rate 5%, among 10,000 cases expect 90 true positives and 495 false positives. A positive then implies 90/585≈15.4% probability.','P(A|B) and P(B|A) are different. High sensitivity alone does not determine positive predictive value.','Bayes’ rule combines likelihood with…',['Only sample size','A prior probability','Only a median','A sorting algorithm'],1,'The posterior is proportional to likelihood times prior, normalized by evidence.','bayes');
M('04 · Probability & statistics','Random variables & distributions','A random variable assigns numbers to outcomes. Discrete variables have probability masses; continuous variables have densities whose interval integrals give probabilities. Bernoulli models a binary trial, binomial counts successes, and normal models a symmetric bell-shaped continuous distribution.','For X~Bernoulli(p), P(X=1)=p and P(X=0)=1−p. For a continuous normal variable, P(X equals exactly one point)=0 despite positive density there.','Density is not point probability and can exceed 1. Its integral over the entire support must be 1.','For a continuous variable, interval probability is…',['Density at the midpoint only','Area under the density over the interval','Always 0','Always 1'],1,'Integrating the density across the interval gives its probability.','normal');
M('04 · Probability & statistics','Expectation, variance & covariance','Expectation is a probability-weighted average. Variance is the expected squared deviation from the mean. Covariance measures joint centered movement; correlation normalizes it. Linearity of expectation does not require independence, but simplifying variance of a sum often does.','A fair die has expected value 3.5, though 3.5 is not a possible roll. For [2,4,6], population variance is (4+0+4)/3=8/3.','Correlation is not causation, and zero correlation does not rule out a nonlinear relationship.','E[X+Y] equals…',['E[X]+E[Y]','E[X]E[Y] always','0 always','Only defined for independent X,Y'],0,'Expectation is linear whenever the expectations exist.','statistics');
M('04 · Probability & statistics','Sampling, CLT & uncertainty','A sample estimates properties of a population. Under suitable conditions, averages of many independent observations are approximately normal, with standard error shrinking like 1/√n. Sampling bias does not disappear merely because a biased dataset becomes large.','If standard deviation is 10, the standard error of a mean from 100 independent observations is 10/√100=1. Quadrupling sample size halves the standard error.','The central limit theorem concerns sampling distributions, not a guarantee that raw data become normally distributed.','Quadrupling sample size typically changes standard error by…',['Doubling it','Halving it','Leaving it unchanged','Multiplying it by 4'],1,'Standard error scales as 1/√n under the usual assumptions.','normal');
M('04 · Probability & statistics','Confidence intervals & hypothesis tests','A confidence interval procedure has a long-run coverage property under its assumptions. A p-value is the probability, under a specified null model, of a result at least as extreme as the observed one. Consider effect size, assumptions and multiple testing, not just a threshold.','A small p-value can occur for a tiny effect in a huge sample. A wide confidence interval indicates substantial estimation uncertainty. Predefine the comparison you intend to make.','A p-value is not the probability that the null hypothesis is true. A 95% frequentist interval does not assign a 95% probability to a fixed parameter after observation.','A p-value is computed assuming…',['The null model','The alternative is certainly true','The result is practically important','Every dataset is unbiased'],0,'It measures extremeness relative to the null model and test procedure.','normal');
M('05 · Math that trains models','Likelihood, MLE & MAP','Likelihood treats observed data as fixed and parameters as variable. Maximum likelihood chooses parameters that make the data most likely. Maximum a posteriori estimation also incorporates a prior. Log likelihood often makes products into tractable sums.','With 7 heads in 10 independent Bernoulli trials, the MLE of p is 0.7. A prior can pull an estimate away from extreme values when data are scarce.','A likelihood is not generally a normalized probability distribution over parameters.','MLE for p with 7 successes out of 10 is…',['.3','.5','.7','7'],2,'For Bernoulli trials the MLE is successes divided by trials.','probability');
M('05 · Math that trains models','Entropy, cross-entropy & KL divergence','Entropy measures uncertainty in a distribution: H(p)=−Σp log p. Cross-entropy compares a true distribution to predicted probabilities. KL divergence is cross-entropy minus entropy and is generally asymmetric. Zero-probability predictions for observed events can lead to infinite log loss.','A fair binary outcome has 1 bit of entropy using log base 2. If the true label is positive, predicting probability .9 gives smaller −ln(p) than predicting .1.','KL is not a distance metric: it is not symmetric and need not satisfy the triangle inequality.','A fair binary outcome has entropy…',['0 bits','1 bit','2 bits','Infinite bits'],1,'−2×0.5×log₂(0.5)=1.','entropy');
M('05 · Math that trains models','Numerical stability & regularization','Finite-precision computation can overflow, underflow or lose significant digits. Stable algebra changes how a mathematically equivalent result is computed. Regularization penalizes model complexity and can improve generalization. L2 penalizes squared weight magnitude; L1 promotes sparse coefficients in many settings.','Stable softmax subtracts the maximum logit before exponentiation. This leaves the normalized probabilities unchanged while reducing overflow risk. Ridge regression adds λΣw² to a squared-error objective.','Regularization strength must be selected using validation data. It is not a substitute for preventing data leakage.','A stable softmax first subtracts…',['The smallest label','The maximum logit','The sample count','Every probability'],1,'Subtracting the maximum keeps exponentials at or below 1 without changing the final ratios.','attention');
ML('01 · The learning workflow','Learning problems & useful baselines','Supervised learning maps inputs to labeled targets; unsupervised learning explores structure without targets. Regression predicts numeric quantities; classification predicts categories. Define the decision your model supports, the unit of prediction and the cost of errors before choosing an algorithm.','To forecast delivery time, start with a constant median or a historical baseline. A sophisticated model is useful only if it improves meaningful held-out performance.','A high score on a poorly chosen metric can produce a useless system. Define success before training.','Predicting a house price is usually…',['Classification','Regression','Clustering only','Tokenization'],1,'Price is a numeric target.','regression');
ML('01 · The learning workflow','Datasets, EDA & data quality','Exploratory data analysis checks schema, units, missing values, duplicates, outliers and label definitions. Understand how data were collected and which population they represent. Inspect groups and time periods because aggregate summaries can hide failures.','A missing temperature is not necessarily 0°C. A measurement after an event may accidentally reveal the label. Document each field’s availability at prediction time.','Outliers may be errors or important rare cases. Investigate before deleting.','What should happen before model fitting?',['Inspect data quality and provenance','Use the test labels as features','Delete every unusual row','Choose the largest model'],0,'Data quality and collection context determine whether the task is valid.','statistics');
ML('01 · The learning workflow','Splits, leakage & cross-validation','Training data fit parameters. Validation data support model choices. Test data estimate final generalization after choices are fixed. Cross-validation repeats train-validation splits. Split by entity or time when random row splits would share future information or related samples.','For multiple records per patient, keep each patient entirely in one split. Fit scaling and imputation inside each training fold using a pipeline.','Repeatedly tuning on the test set turns it into validation data. Leakage can produce impressive but invalid scores.','A scaler should normally be fit on…',['All data before splitting','Training data only','Only test data','Labels only'],1,'Fitting on held-out data lets information leak into the learned pipeline.','split');
ML('01 · The learning workflow','Preprocessing & feature engineering','Models consume numerical representations. Impute missing values, encode categories and scale features according to the algorithm. Fit transformations on training data. Add domain-informed features only when they are available at prediction time. Keep transformations with the model as one pipeline.','One-hot encoding represents categories using indicator columns. Standardization subtracts the training mean and divides by its standard deviation. A binary missingness flag can preserve information about absent values.','Integer category codes can accidentally imply an order. Scale-sensitive algorithms and trees have different needs.','One-hot encoding is commonly used for…',['Nominal categories','Removing labels','Sorting test outcomes','Encrypting weights'],0,'It represents categories without assigning an artificial numeric ranking.','matrix');
ML('02 · Supervised learning','Linear regression & residuals','Linear regression predicts ŷ=w·x+b. Ordinary least squares minimizes summed squared residuals. Residuals are observed minus predicted values. Inspect them for structure, unequal spread and outliers. A linear model can include transformed features while remaining linear in its parameters.','For points (1,3),(2,5),(3,7), ŷ=2x+1 fits perfectly. With noisy data, the best line balances squared vertical errors.','A fitted relationship does not prove a causal effect. Extrapolation beyond observed inputs may fail.','A residual is…',['Observed minus predicted','The number of features','Only the intercept','The learning rate'],0,'Residuals measure the signed prediction error for each observation.','regression');
ML('02 · Supervised learning','Logistic regression & thresholds','Logistic regression applies a sigmoid to a linear score to estimate a binary probability. Training typically minimizes log loss. A classification threshold converts probabilities to decisions and should reflect costs, capacity and validation results.','A probability .7 becomes positive with threshold .5 but negative with threshold .8. The probability estimate and final decision are distinct.','Logistic regression is a classifier despite its name. A threshold of .5 is not universally optimal.','Increasing a positive-class threshold usually…',['Predicts fewer positives','Predicts more positives','Changes labels automatically','Guarantees higher recall'],0,'Fewer scores exceed a higher threshold.','sigmoid');
ML('02 · Supervised learning','Nearest neighbors & distance','k-nearest neighbors predicts from nearby training examples. Classification uses votes or weighted votes; regression uses averages. Feature scaling and distance choice strongly affect neighborhoods. Small k can be noisy; large k smooths but may miss local structure.','With k=3 and neighbor labels A,A,B, majority voting predicts A. A feature measured in thousands can dominate another measured between 0 and 1 without scaling.','Distance becomes less informative in many high-dimensional settings. Inference may be expensive without suitable indexing.','Neighbors A,A,B with k=3 predict…',['A','B','Always a tie','No prediction'],0,'A receives two of the three votes.','knn');
ML('02 · Supervised learning','Decision trees & information gain','A decision tree recursively divides data using feature tests. Each split tries to improve purity or reduce regression error. Leaves make predictions. Trees capture nonlinear interactions and are interpretable when small, but deep trees can overfit.','A split such as hours < 3 separates two groups. Information gain is parent impurity minus the sample-weighted impurity of the children.','A pure leaf with one example may reflect memorization. Control depth, minimum leaf size and pruning using validation.','What can reduce tree overfitting?',['Limiting depth','Adding every possible split','Using test labels','Removing validation'],0,'Depth limits constrain how specifically the tree can partition training data.','entropy');
ML('02 · Supervised learning','Random forests & bagging','Bagging trains models on bootstrap samples and aggregates predictions. Random forests also consider random feature subsets at splits, reducing correlation between trees. Averaging unstable models can reduce variance. Feature importance must be interpreted cautiously.','For classification, many trees vote; for regression, their predictions average. Out-of-bag observations can estimate performance for suitable datasets and assumptions.','Impurity-based importance can favor variables with many possible splits. Importance is not proof of causality.','Bagging primarily aggregates models trained on…',['Bootstrap samples','Only the test set','A single identical leaf','Unrelated targets'],0,'Bootstrap resampling creates varied training datasets whose models are aggregated.','split');
ML('02 · Supervised learning','Boosting & additive models','Boosting builds models sequentially so later learners address the current ensemble’s errors. Gradient boosting fits updates related to the loss gradient. Learning rate, number of estimators and tree complexity interact. Early stopping uses a validation criterion.','For squared error, a new weak learner can fit current residuals. A small step of its prediction is added to the ensemble.','More boosting rounds can overfit. Tuning on the test set still leaks information even with a powerful library.','Boosting adds learners…',['Sequentially','Only once','Only by random guessing','Without reference to a loss'],0,'Each learner updates the existing ensemble based on what it has not yet modeled well.','gradient');
ML('02 · Supervised learning','Support vectors, kernels & Naive Bayes','An SVM seeks a separating boundary with a large margin, with soft margins allowing errors. Kernels compute implicit feature-space similarities. Naive Bayes uses Bayes’ rule with conditional feature-independence assumptions given the class. Both are useful baselines in suitable settings.','A linear SVM can classify text vectors. A multinomial Naive Bayes model uses token counts and smoothing to avoid zero probability for unseen terms.','Naive Bayes does not assume features are unconditionally independent. Kernel choices and scaling matter for SVMs.','Naive Bayes assumes feature independence…',['Given the class','Under every circumstance','Only after deleting labels','Between all samples and labels'],0,'The simplifying assumption is conditional on class membership.','bayes');
ML('03 · Evaluation & generalization','Classification metrics & confusion matrices','A confusion matrix counts true positives, false positives, true negatives and false negatives. Precision asks how many predicted positives were correct; recall asks how many actual positives were found. F1 is their harmonic mean. Choose metrics according to error costs and class balance.','With TP=8, FP=2 and FN=4, precision is 8/10=.8 and recall is 8/12≈.667. Accuracy also needs true negatives.','A classifier that predicts the majority class can have high accuracy while missing every rare positive.','Precision equals…',['TP/(TP+FP)','TP/(TP+FN)','TN/(TN+FN)','FP/TP'],0,'Precision conditions on predicted positives.','confusion');
ML('03 · Evaluation & generalization','ROC, PR curves & calibration','ROC plots true-positive rate against false-positive rate as the threshold varies. Precision-recall plots focus on positive predictions and can be informative for rare positives. Calibration asks whether predicted probabilities match observed frequencies. Ranking, calibration and decisions are different properties.','Among cases assigned probability .8, a calibrated model should be correct about 80% of the time over enough comparable cases. A model may rank well while its probabilities are overconfident.','AUC does not choose an operating threshold or encode every deployment cost.','Calibration concerns…',['Reliability of predicted probabilities','Only sorting speed','The number of hidden layers','Feature names'],0,'It compares probability forecasts with empirical frequencies.','sigmoid');
ML('03 · Evaluation & generalization','Bias, variance & regularization','Underfitting misses meaningful structure; overfitting learns sample-specific noise. Training and validation curves help diagnose the difference. Regularization, simpler models, more representative data and early stopping can improve generalization. The bias-variance decomposition depends on the learning setting and loss.','A very high-degree polynomial may interpolate training data and swing wildly between points. A simpler model can have slightly worse training error but lower validation error.','A low training error alone is not evidence of a strong model.','Very low training error and high validation error suggest…',['Overfitting','Perfect generalization','No model was trained','Guaranteed data quality'],0,'The model fits training-specific structure that does not transfer.','overfit');
ML('03 · Evaluation & generalization','Hyperparameters & experiment design','Parameters are fitted from data; hyperparameters define training choices such as tree depth or regularization strength. Compare configurations using validation or cross-validation. Keep the evaluation protocol fixed and log each experiment. Nested validation can help estimate performance after tuning.','Choose a regularization strength from a small logarithmic grid, then evaluate the selected pipeline once on a reserved test set. Compare against the same baseline and split.','Trying hundreds of configurations can overfit the validation process. Report the selection procedure honestly.','Tree depth is generally a…',['Hyperparameter','Target label','Residual','Raw sample'],0,'It is a training configuration chosen outside the fitted split values.','split');
ML('04 · Unsupervised & specialized ML','K-means & clustering','K-means alternates assigning points to the nearest center and recomputing each center as its assigned points’ mean. It minimizes within-cluster squared distances locally. Initialization and k matter; multiple starts can help. Not every real cluster is spherical or equally sized.','For points near (−2,−2) and (2,2), two centers tend to settle near the two groups. A crescent-shaped cluster can challenge Euclidean centroid methods.','Cluster labels have no inherent meaning and can be permuted. Evaluate usefulness with domain context.','After assignments, a k-means center moves to…',['Its assigned points’ mean','The farthest point always','The origin always','A target label'],0,'The mean minimizes the sum of squared Euclidean distances for fixed assignments.','clusters');
ML('04 · Unsupervised & specialized ML','DBSCAN, mixtures & anomaly detection','DBSCAN groups dense regions and marks sparse points as noise using a radius and minimum-neighbor rule. Gaussian mixtures use soft probabilistic membership. Anomaly detection flags unusual behavior relative to a model, but unusual does not automatically mean fraudulent or incorrect.','A density method can identify curved groups where k-means struggles. A mixture model can assign a point partial probability to several components.','Anomaly thresholds need validation with operational costs. Contaminated training data can normalize harmful patterns.','DBSCAN can explicitly mark points as…',['Noise','Always class 1','Perfectly calibrated','A principal component'],0,'Points not connected to sufficiently dense regions may be labeled noise.','clusters');
ML('04 · Unsupervised & specialized ML','Dimensionality reduction & embeddings','Dimensionality reduction compresses features. PCA preserves high-variance linear directions; nonlinear methods can visualize local structure. An embedding represents an object as a vector learned or engineered for a purpose. Distances are meaningful only relative to that purpose and preprocessing.','A two-dimensional projection can reveal groups in a high-dimensional dataset, but apparent gaps depend on the method and settings. Compare with quantitative evaluation.','Distances between far-apart groups in some nonlinear visualizations may not represent original global distances faithfully.','PCA should be fitted using…',['Training data','Future test information','Only chart colors','The final report'],0,'Its learned centering and directions are preprocessing parameters.','pca');
ML('04 · Unsupervised & specialized ML','Time series & forecasting','Time series have temporal order, trend, seasonality and possible autocorrelation. Forecasting must use only information available at the forecast origin. Use rolling or expanding-window evaluation and compare with naive seasonal baselines. Evaluate the horizon that matters.','To predict tomorrow, yesterday’s sales are allowed but tomorrow’s final total is not. A seasonal naive forecast uses the corresponding value from the previous season.','A random train-test split can leak the future. Rolling averages must also be computed using past data only.','A suitable forecasting split respects…',['Chronological order','Alphabetical feature names','Only random shuffling','Plot color'],0,'The model should be evaluated on later observations using earlier information.','split');
ML('04 · Unsupervised & specialized ML','Recommendation, ranking & causal caution','Recommendation selects or ranks items for a user or context. Collaborative filtering uses interaction patterns; content-based methods use item attributes. Offline ranking metrics should be paired with careful real-world evaluation. Observed clicks reflect prior exposure and can be biased.','A system trained only on displayed items may mistake lack of exposure for dislike. Hold out interactions in time and consider what candidates were actually available.','Predicting who buys is different from estimating who buys because of an intervention. Causal questions require additional assumptions and designs.','A click log is affected by…',['Which items were shown','Only user taste','No selection effects','Only storage format'],0,'Exposure and previous ranking decisions influence the observed data.','dot');
ML('05 · Production ML','Pipelines, deployment & monitoring','Deployment packages preprocessing and prediction behind a stable interface. Validate schema, units and missing-value behavior. Monitor latency, data quality, distribution shift and delayed outcome metrics. Version artifacts and keep a rollback path. Retraining should be triggered by evidence and evaluated before release.','A model trained with standardized inputs must receive the same transformation at inference. A change from centimeters to meters can break predictions without changing column names.','Drift is a warning, not proof that accuracy decreased. Label-based monitoring is needed when outcomes become available.','Why deploy preprocessing with the model?',['To preserve training/inference consistency','To remove validation','To make labels optional in training','To guarantee zero drift'],0,'The model’s learned weights assume the same representation used during training.','split');
ML('05 · Production ML','Interpretability, fairness & privacy','Interpretability tools explain model behavior, not necessarily real-world causes. Assess performance across relevant groups and intended uses. Protect sensitive data through access controls and data minimization. Fairness objectives can conflict, so document choices and their consequences.','A feature attribution may say a feature influenced a prediction. It does not show changing that feature would cause the desired outcome. Compare false-negative rates across groups when missed cases matter.','A single overall accuracy metric can hide a subgroup failure. Removing one sensitive column may leave correlated proxies.','Feature attribution directly establishes causality?',['Yes, always','No','Only for large models','Only with colorful plots'],1,'Attribution describes model dependence, which is different from a causal effect.','confusion');
ML('05 · Production ML','Capstone: reproducible prediction','Build a complete prediction project: define the target, audit data, split safely, train a baseline, build a pipeline, compare models, evaluate once and write a model card. Include limitations and an example inference payload. Keep the exact data and model versions.','Use a public tabular dataset or a generated dataset. Your report should include the baseline, split rationale, selected metric, error analysis and deployment assumptions.','Do not choose the best test result from many experiments and present it as an untouched final estimate.','Which belongs in a model card?',['Intended use and limitations','Only a logo','Only the best training score','Secret credentials'],0,'A model card communicates scope, evidence and boundaries.','regression');
A('01 · AI foundations','AI, ML & intelligent systems','AI is the broader study of systems performing tasks associated with intelligent behavior. ML learns patterns from data; deep learning uses multilayer neural networks. Useful AI systems often combine learned models with rules, search, databases and human decisions. Start from a task and measurable success.','A route planner may use graph search without learning. A spam filter may use learned classification. A document assistant combines retrieval, language generation and permission checks.','AI is not synonymous with a chatbot, and a fluent answer is not evidence of correctness.','Which is a non-learning AI technique?',['Graph search','Gradient fitting','Supervised regression','Training embeddings'],0,'Graph search can solve a problem using explicit states and rules.','search');
A('01 · AI foundations','State-space search: BFS, DFS & A*','Search defines states, actions, a start and a goal. BFS explores by depth; DFS follows branches; uniform-cost search expands by path cost. A* prioritizes g(n)+h(n), combining cost so far with a heuristic. Guarantees depend on assumptions and correct duplicate handling.','On a grid with unit-cost cardinal moves, Manhattan distance is an admissible heuristic if movement constraints do not make a shorter path possible. Obstacles can increase actual cost.','A heuristic that overestimates can sacrifice optimality. DFS does not generally find the shortest path.','A* usually prioritizes…',['g(n)+h(n)','Only node names','The deepest node','A random edge'],0,'It combines known path cost with estimated remaining cost.','search');
A('01 · AI foundations','Knowledge, logic & constraint solving','Symbolic systems represent facts and rules explicitly. Logic supports inference under defined semantics. Constraint satisfaction assigns values satisfying restrictions. These methods are useful when rules must be inspected and exact consistency matters. Uncertainty requires additional modeling beyond simple true/false facts.','A scheduling problem assigns times to classes subject to room, teacher and overlap constraints. Backtracking rejects a partial assignment as soon as it violates a rule.','A logically valid conclusion can still be useless if the premises are wrong or incomplete.','A Sudoku solver is naturally a…',['Constraint satisfaction system','Regression model only','Language tokenizer','Random file sorter'],0,'Digits must satisfy row, column and box constraints.','search');
A('02 · Deep learning','Neurons, activations & forward passes','A neuron computes a weighted sum plus bias, then an activation. Layers compose these transformations. Nonlinear activations let a network represent relationships that stacked linear maps alone cannot. A forward pass computes predictions for the current weights.','For x=(1,2), w=(.5,−1) and b=.2, z=.5−2+.2=−1.3. ReLU(z)=max(0,z)=0.','Stacking linear layers without nonlinearities still produces a linear map, aside from the combined bias.','ReLU(−3) equals…',['−3','3','0','1'],2,'ReLU outputs the maximum of zero and its input.','network');
A('02 · Deep learning','Loss functions & backpropagation','A loss quantifies disagreement between prediction and target. Backpropagation applies the chain rule efficiently to compute gradients throughout a computational graph. An optimizer then updates parameters. Forward computation, gradient computation and optimization are separate steps.','For prediction w×x and squared error (wx−y)², the derivative with respect to w is 2(wx−y)x. Automatic differentiation computes this through primitive operations.','Backpropagation computes derivatives; it is not itself the full training algorithm.','Backpropagation primarily computes…',['Gradients','Train-test splits','Database permissions','Token vocabulary'],0,'It propagates derivatives through the graph using the chain rule.','gradient');
A('02 · Deep learning','Training loops, initialization & optimizers','A training loop loads a batch, performs a forward pass, computes loss, clears old gradients, backpropagates and updates weights. Initialization influences signal propagation. SGD, momentum and Adam use gradients differently. Monitor both training and validation curves.','In PyTorch, a typical loop uses optimizer.zero_grad(), loss.backward() and optimizer.step(). Evaluation uses model.eval() and usually disables gradient tracking.','Forgetting to clear gradients accumulates them unintentionally. Evaluation mode and disabled gradients solve different problems.','Why clear gradients before an ordinary training step?',['To avoid unintended accumulation','To delete the dataset','To reset labels','To make every prediction identical'],0,'Many autodiff frameworks accumulate gradients by default.','gradient');
A('02 · Deep learning','CNNs, convolution & pooling','Convolution applies a shared local filter across a grid, capturing spatial patterns with fewer parameters than independent connections. Channels represent learned features. Stride, padding and kernel size determine output shape. Pooling aggregates nearby activations.','A 3×3 kernel with stride 1 and no padding applied to a 5×5 input yields a 3×3 output. Early filters may respond to edges; deeper ones combine patterns.','A convolution layer does not inherently guarantee rotation invariance. Padding changes boundary behavior.','5×5 input, 3×3 kernel, stride 1, no padding gives…',['5×5','3×3','2×2','1×1'],1,'Each dimension is (5−3)/1+1=3.','convolution');
A('02 · Deep learning','Sequences, RNNs & LSTMs','Sequence models use order and context. RNNs update a hidden state over time; LSTMs use gates to help retain and discard information. Variable sequence length, padding and masking need explicit handling. Long-range dependencies can be hard for simple recurrent models.','A sentiment model reads a sequence of tokens and summarizes context into a representation. A mask prevents padded positions from contributing as real data.','Shuffling tokens changes a sequence’s meaning. A long sequence can create optimization and memory challenges.','Why use a padding mask?',['To ignore artificial padding positions','To remove all context','To force equal labels','To sort words alphabetically'],0,'Padding exists for batching and should not be interpreted as content.','attention');
A('02 · Deep learning','Attention & transformers','Attention forms weighted combinations of value vectors using similarities between queries and keys. Scaled dot-product attention is softmax(QKᵀ/√dₖ)V. Transformers combine attention with feed-forward blocks, residual connections and normalization. Position information is needed to represent order.','A token can attend to other tokens relevant to its context. In causal language modeling, a mask prevents attending to future tokens during next-token prediction.','Attention weights are not a complete causal explanation of a model’s decision.','A causal attention mask prevents looking at…',['Future tokens','Every token','Past tokens only','The vocabulary'],0,'Next-token prediction must not access the future target sequence.','attention');
A('03 · Language & generative AI','Tokens, embeddings & language modeling','A tokenizer maps text to discrete token IDs, often using subword units. Embeddings map IDs to learned vectors. A language model predicts a distribution over possible next tokens given context. Repeated sampling or selection creates a sequence.','The word count and token count are not equal. A rare word may split into several pieces, and a context window limits how much tokenized material the model can process at once.','A likely continuation is not necessarily a factually correct answer. Tokenization depends on the model.','Embeddings map tokens to…',['Numeric vectors','Guaranteed facts','Database passwords','Only one-hot labels'],0,'Learned vectors provide continuous representations used by the model.','dot');
A('03 · Language & generative AI','Pretraining, fine-tuning & transfer','Pretraining learns broad representations from large datasets. Fine-tuning adapts parameters using task-specific data. Transfer learning reuses learned features. Parameter-efficient methods update a smaller set of weights or adapters. Compare quality, cost and data needs against simpler alternatives.','An image classifier may reuse a pretrained backbone and train a small output head. A language application may improve with retrieval before any fine-tuning is needed.','Fine-tuning is not a reliable database for frequently changing facts. Small datasets can cause overfitting or forgetting.','Transfer learning reuses…',['Previously learned representations','Only random labels','No model parameters','Only file names'],0,'Existing representations can reduce data and compute needed for a related task.','network');
