A('03 · Language & generative AI','Prompt design & structured outputs','A prompt should define the task, relevant context, constraints and desired output. Examples can clarify ambiguous formats. Structured output schemas help parsing, but values still need validation. Evaluate prompts on representative cases instead of judging one impressive example.','For extraction, specify fields, allowed missing values and how to handle uncertainty. Parse the response and reject invalid types or impossible values before using it.','A prompt saying “always be correct” is not a correctness guarantee. Do not trust generated JSON just because it parses.','After receiving structured model output, you should…',['Validate schema and values','Execute every included command','Assume all facts are correct','Delete your tests'],0,'Syntactic structure does not guarantee semantic correctness.','pipeline');
A('03 · Language & generative AI','Retrieval-augmented generation','RAG retrieves relevant external material and supplies it to a generator. A pipeline ingests documents, chunks them, indexes representations, retrieves candidates, optionally reranks and generates a grounded response. Evaluate retrieval and answer quality separately.','A policy assistant should retrieve the current applicable policy, preserve document identifiers and attach citations that actually support its answer. Permission filtering must happen before protected text reaches the model.','RAG reduces some knowledge gaps but does not eliminate hallucinations. Retrieved text is untrusted data, not higher-priority instructions.','Why measure retrieval quality separately?',['Missing evidence limits the generator','Retrieval guarantees perfect answers','It replaces access control','It removes all costs'],0,'If the needed evidence is never retrieved, downstream generation lacks the necessary support.','pipeline');
A('03 · Language & generative AI','Vector search, chunking & reranking','Vector search retrieves items near a query embedding under a chosen similarity measure. Chunking balances context and specificity. Hybrid retrieval combines semantic and lexical signals. Rerankers score a smaller candidate set more carefully. Tune using realistic queries and relevance judgments.','A question containing an exact product code may benefit from keyword search, while a paraphrased conceptual question may benefit from embeddings. Combining them can improve coverage.','Larger chunks are not always better. Similarity is model-dependent and does not establish truth or access permission.','Hybrid retrieval combines…',['Lexical and semantic search','Only two random models','Training and test labels','Encryption and sorting'],0,'The methods retrieve complementary kinds of matches.','dot');
A('04 · Agents & multimodal systems','Tool use, agents & workflow design','An agent selects actions using observations and a policy, often with a model inside a controlled loop. Tools expose limited, validated operations. Define stopping criteria, budgets, retries and failure paths. A fixed workflow is often easier to test than an open-ended loop.','A research workflow can search, retrieve, summarize and verify citations. A sending action should require appropriate authorization, even if a model requests it.','A model-generated tool call is a proposal, not proof of permission. Bound loops to prevent repeated failures or unbounded cost.','A robust agent should have…',['Explicit stopping conditions and budgets','Unlimited retries','Access to every secret','No action validation'],0,'Controls keep the process predictable and bounded.','pipeline');
A('04 · Agents & multimodal systems','Memory, state & orchestration','State records what a workflow knows and has done. Separate short-lived context, durable records and retrieved knowledge. Use explicit state transitions, idempotent actions and event logs. Persist only what is necessary, with appropriate retention and permissions.','If a job retries after a timeout, an idempotency key can prevent duplicate side effects. Store a durable job status instead of relying only on a model’s conversation summary.','A summary can omit facts or introduce errors. It is not a transactional database.','An idempotent retry helps avoid…',['Duplicate side effects','All model errors','The need for logging','Every timeout'],0,'Repeated execution with the same identity should not duplicate the intended action.','pipeline');
A('04 · Agents & multimodal systems','Vision, audio & multimodal models','Multimodal systems combine representations of text, images, audio or video. Tasks include classification, detection, segmentation, transcription and cross-modal retrieval. Sampling rates, resolution and synchronization affect the information available. Evaluate each modality and their interaction.','Image classification labels a whole image; object detection adds locations; segmentation labels pixels. Speech recognition converts audio into text, which may still contain errors requiring verification.','A confident transcription can be wrong. Cropping, compression or missing context can change meaning.','Pixel-level labeling is called…',['Segmentation','Classification only','Token sampling','Clustering always'],0,'Segmentation assigns labels to individual pixels or regions.','convolution');
A('04 · Agents & multimodal systems','Generative models: VAEs, GANs & diffusion','Generative models learn patterns that can produce new samples. VAEs use latent variables and a variational objective. GANs train a generator against a discriminator. Diffusion methods learn to reverse a noising process. Sampling and training costs differ across approaches.','A diffusion model begins from noise and iteratively denoises under learned guidance. A generated image may look plausible while violating physical or factual details.','Visual realism does not imply factual authenticity. Evaluate diversity, quality and potential memorization.','Diffusion generation typically involves…',['Iterative denoising','Only sorting images','Exact copying by definition','A SQL join'],0,'The model learns steps that reverse a corruption/noising process.','probability');
A('04 · Agents & multimodal systems','Reinforcement learning & rewards','An RL agent observes a state, chooses an action and receives a reward through interaction. A policy maps observations to actions; a value function estimates future return. Exploration gathers information while exploitation uses current knowledge. Delayed rewards complicate credit assignment.','A grid agent may receive a reward at the goal and small movement costs. Discount factor γ controls how future rewards contribute to return.','Optimizing a poorly specified reward can produce unwanted behavior. Simulation performance may not transfer to reality.','Exploration means…',['Trying actions to learn more','Always repeating the current best action','Deleting rewards','Ignoring outcomes'],0,'Exploration gathers evidence that can improve later decisions.','search');
A('05 · Reliable AI products','Evaluation, red-teaming & observability','Evaluate with representative tasks, known answers where possible and rubrics for open-ended outputs. Measure task success, groundedness, latency and cost. Include adversarial and failure cases. Log enough to diagnose errors without exposing unnecessary sensitive content.','For a document assistant, test answerability, correct abstention, citation support and permission boundaries. Track regressions when changing the model, prompt or retrieval settings.','A single aggregate score can hide serious failures. Model-as-judge evaluation also needs calibration and spot checks.','What is a good evaluation set?',['Representative tasks plus edge cases','Only the easiest examples','The same one demo repeatedly','No expected behavior'],0,'It should reflect actual use and relevant failures.','confusion');
A('05 · Reliable AI products','Prompt injection, privacy & permissions','Prompt injection places adversarial instructions inside material a model may read. Treat external documents and tool outputs as untrusted data. Enforce permissions outside the model, validate tool arguments and require authorization for consequential actions. Minimize secret exposure.','A retrieved document saying “send all private files” must not gain authority over the application. The tool layer should reject unauthorized actions regardless of model output.','A system prompt alone is not a complete security boundary. Do not embed private API keys in browser-delivered source.','Where should action permissions be enforced?',['In application/tool controls','Only in generated prose','Only by document authors','Nowhere'],0,'Deterministic controls must enforce authorization beyond the model’s instructions.','pipeline');
A('05 · Reliable AI products','Serving, latency, cost & model operations','Serving requires timeouts, rate limits, input bounds and graceful failure behavior. Measure latency distributions and cost per successful task. Caching, batching, quantization and smaller models can help with different tradeoffs. Track model and prompt versions for reproducibility and rollback.','A cached answer can reduce latency but becomes unsafe if reused across permission boundaries or after source data changes. Include relevant identity and version context in the cache design.','A lower cost per call may still cost more per successful task if quality falls and retries increase.','A useful cost metric is…',['Cost per successful task','Only model file size','Only the cheapest single call','Number of colors in the UI'],0,'It connects resource use to the actual outcome the system delivers.','pipeline');
A('05 · Reliable AI products','Capstone: a grounded assistant','Build a document assistant with a small approved corpus, ingestion, retrieval, citations, a clear answerability policy and evaluation cases. Add controlled tools only when necessary. Document data retention, limitations and failure handling. Real model integration needs a server-side credential.','Start with ten questions whose answers are in the corpus and five that cannot be answered. Check retrieval, citation support and correct abstention, then add permission and adversarial tests.','This learning app teaches AI concepts locally; it does not pretend to be a live LLM service or expose a secret key in HTML.','A useful assistant should abstain when…',['Evidence is insufficient','The font changes','There are many tokens available','It wants more XP'],0,'Honest handling of insufficient evidence is part of reliable behavior.','pipeline');
G('01 · Test strategy & arithmetic','GRE structure & a study strategy','The GRE General Test includes Analytical Writing, Verbal Reasoning and Quantitative Reasoning. This app uses a 30-minute issue essay, two verbal sections of 12 and 15 questions in 18 and 23 minutes, and two quant sections of 12 and 15 in 21 and 26 minutes. Confirm current details with ETS before booking.','Begin with an untimed diagnostic, keep an error log, review weak concepts and then add time pressure. The app’s original fixed-form practice is not an official adaptive test and does not predict a scaled GRE score.','Timed practice is only one part of learning. Review why wrong options tempted you, not just the answer key.','Which area belongs to GRE General Test preparation?',['Quant, Verbal and Analytical Writing','Calculus only','Python syntax only','A laboratory practical'],0,'GRE preparation covers all three reasoning and writing areas.','');
G('01 · Test strategy & arithmetic','Integers, divisibility & remainders','An integer may be positive, negative or zero. Divisibility means a quotient is an integer with no remainder. For positive divisor d, write n=qd+r with 0≤r<d. Parity and remainder cases often solve questions faster than large computations.','If n leaves remainder 2 when divided by 5, n=5k+2. Then n+3=5(k+1) is divisible by 5. The product of an even integer and any integer is even.','Zero is even but neither positive nor negative. A prime is a positive integer greater than 1 with exactly two positive divisors.','Remainder when 23 is divided by 5?',['2','3','4','5'],1,'23=4×5+3.','');
G('01 · Test strategy & arithmetic','Primes, factors, GCD & LCM','Prime factorization expresses a positive integer greater than 1 as a product of primes. The GCD uses the minimum prime exponents shared by numbers; the LCM uses the maximum exponents. Factor structure helps count divisors and identify common cycles.','12=2²×3 and 18=2×3². Their GCD is 2×3=6, and LCM is 2²×3²=36. For positive integers a,b, gcd(a,b)×lcm(a,b)=ab.','1 is not prime. A number may have repeated prime factors, so count exponents carefully.','LCM of 12 and 18?',['6','24','36','72'],2,'Use the highest exponent of each prime: 2²×3².','');
G('01 · Test strategy & arithmetic','Fractions, decimals & estimation','Fractions represent ratios and parts of a whole. Use common denominators to add and multiply by a reciprocal to divide. Estimation checks plausibility before exact calculation. Compare signs and magnitudes to eliminate options quickly.','3/4+1/6=9/12+2/12=11/12. Since both fractions are positive and sum near 1, an answer greater than 2 is implausible.','Adding denominators directly is invalid. Dividing by a small positive fraction increases a positive number.','3/4 + 1/6 = ?',['4/10','5/6','11/12','1'],2,'The common denominator is 12.','');
G('01 · Test strategy & arithmetic','Percentages & successive change','A percentage is a ratio out of 100. Percentage change uses the original value as the base. Successive changes multiply factors rather than simply adding rates. Reverse percentages divide by the change factor.','A 20% increase followed by a 20% decrease multiplies by 1.2×.8=.96, a net 4% decrease. A final price 80 after a 20% discount came from 80/.8=100.','A percent and a percentage point are different. A rise from 20% to 30% is 10 points but a 50% relative increase.','Up 20%, then down 20% gives…',['No change','4% decrease','4% increase','40% decrease'],1,'The combined multiplier is .96.','functions');
G('01 · Test strategy & arithmetic','Ratios, proportions & mixtures','A ratio compares quantities with compatible units. Represent a:b as ak and bk. Mixture problems preserve the total amount of the ingredient, not an unweighted average of percentages. Proportions can be direct or inverse depending on the relationship.','A 2:3 ratio totaling 25 gives k=5, so the parts are 10 and 15. Mixing 2 L of 10% solution with 3 L of 20% yields (.2+.6)/5=16%.','Do not average 10% and 20% directly unless the mixture quantities are equal.','A 2:3 ratio totaling 25 has smaller part…',['5','10','12','15'],1,'There are five ratio units, each worth 5.','');
G('01 · Test strategy & arithmetic','Rates, work & units','Distance equals rate times time. Work rates add when workers operate independently on the same task. Track units at every step. Average speed is total distance divided by total time, not usually the arithmetic mean of speeds.','If A completes a job in 6 hours and B in 3, their rates sum to 1/6+1/3=1/2 job per hour, so together they need 2 hours.','Equal-distance journeys at different speeds require a harmonic-style calculation, not a simple mean.','Workers need 6 h and 3 h individually. Together?',['2 h','3 h','4.5 h','9 h'],0,'Their combined rate is half a job per hour.','');
G('02 · Algebra & quantitative comparison','Linear equations & systems','Preserve equality by applying the same valid operation to both sides. Two independent linear equations can determine two unknowns. Substitution replaces a variable; elimination combines equations to cancel one. Check the result in the original statements.','From x+y=7 and x−y=1, add to get 2x=8, so x=4 and y=3.','Dependent equations may describe infinitely many solutions; inconsistent equations have none.','If x+y=7 and x−y=1, x is…',['3','4','6','7'],1,'Adding eliminates y and gives x=4.','functions');
G('02 · Algebra & quantitative comparison','Inequalities & absolute value','Inequalities describe ranges. Multiplying or dividing by a negative reverses the inequality sign. Absolute value is distance from zero. |x−a|<r means x lies within r of a for positive r. Use a number line to combine constraints.','−2x>6 implies x<−3. |x−2|<3 means −1<x<5. Endpoints are included only when the inequalities allow equality.','When a variable’s sign is unknown, multiplying by it may require cases.','Solve −2x > 6.',['x > −3','x < −3','x > 3','x < 3'],1,'Divide by −2 and reverse the sign.','functions');
G('02 · Algebra & quantitative comparison','Quadratics, exponents & roots','Quadratics contain a squared variable. Factoring and the quadratic formula identify roots. x²=a for positive a has roots ±√a, while √a denotes the nonnegative principal root. Exponent rules require attention to signs, zero and domain restrictions.','x²−5x+6=(x−2)(x−3), so the roots are 2 and 3. √(x²)=|x| for real x.','Do not discard a negative solution merely because a square root symbol is positive.','The solutions of x²=9 are…',['3 only','−3 only','−3 and 3','9 and −9'],2,'Both 3 and −3 square to 9.','functions');
G('02 · Algebra & quantitative comparison','Functions, sequences & coordinate graphs','A function follows an input-output rule and may be piecewise. Evaluate compositions from the inside out. Coordinate graphs encode slopes, intercepts and intersections. Arithmetic sequences add a constant; geometric sequences multiply by a constant.','If f(x)=2x+1, then f(f(2))=f(5)=11. A line through (0,2) and (3,8) has slope 2 and intercept 2.','f(x+h) is not generally f(x)+f(h). Graphs without an explicit scale may not support visual estimates.','For f(x)=2x+1, f(f(2)) is…',['5','7','10','11'],3,'First f(2)=5; then f(5)=11.','functions');
G('02 · Algebra & quantitative comparison','Quantitative Comparison & counterexamples','Quantitative Comparison asks whether A is greater, B is greater, they are equal, or the relationship cannot be determined. Work from the stated constraints. Test valid counterexamples including zero, negatives and fractions when allowed. One counterexample can disprove an always-true claim.','If x is any real number, compare A=x and B=x². x=2 makes B larger; x=.5 makes A larger. Therefore the relationship cannot be determined.','Examples help disprove a fixed relationship but several agreeing examples do not prove it universally.','For any real x, compare A=x and B=x².',['A greater','B greater','Equal','Cannot be determined'],3,'Valid inputs produce different relationships.','functions');
G('03 · Geometry & data','Lines, angles & triangles','Parallel lines cut by a transversal give equal corresponding and alternate interior angles. Triangle angles sum to 180°. Similar triangles preserve ratios; right triangles satisfy the Pythagorean theorem. Special 45-45-90 and 30-60-90 triangles save time.','In a 45-45-90 triangle with legs 4, the hypotenuse is 4√2. In a 30-60-90 triangle, side ratios are 1:√3:2.','A drawing is not necessarily to scale unless indicated. Do not infer equal lengths only from appearance.','Two triangle angles are 50° and 60°. The third is…',['60°','70°','80°','90°'],1,'180−50−60=70.','geometry');
G('03 · Geometry & data','Circles, polygons & solids','Circle area is πr² and circumference is 2πr. A sector is its angle fraction of the whole circle. Polygon interior-angle sum is (n−2)×180°. Volume and surface area are different quantities; use cubic and square units respectively.','A cylinder with radius 2 and height 5 has volume π×4×5=20π. A 90° sector of radius 4 has area (1/4)π×16=4π.','Radius and diameter differ by a factor of 2. Doubling radius quadruples circle area.','Area of a circle of radius 3?',['3π','6π','9π','18π'],2,'πr²=9π.','geometry');
G('03 · Geometry & data','Mean, median, range & weighted averages','The mean uses every value; the median is the central sorted value; the range is maximum minus minimum. A weighted mean accounts for unequal group sizes. Outliers can move the mean much more than the median.','For 2,3,10, the mean is 5 and median is 3. Combining 10 people averaging 4 with 20 averaging 7 gives (40+140)/30=6.','Never average group averages without checking weights. Sort data before finding the median.','Median of 2,3,10?',['2','3','5','10'],1,'The middle value of the sorted list is 3.','statistics');
G('03 · Geometry & data','Standard deviation & distributions','Standard deviation measures spread around the mean in the original units. Adding the same constant to all values shifts the mean but leaves spread unchanged. Multiplying all values by c multiplies standard deviation by |c|. Normal distributions are symmetric.','Datasets [4,5,6] and [14,15,16] have equal standard deviation. [8,10,12] has twice the spread of [4,5,6].','Do not confuse standard deviation with standard error or range. A larger mean does not imply a larger standard deviation.','Adding 10 to every observation changes standard deviation by…',['+10','×10','No change','It becomes zero'],2,'All distances from the mean stay the same.','normal');
G('03 · Geometry & data','Probability & counting','For equally likely outcomes, probability is favorable outcomes divided by total outcomes. Complement probability is 1−P(A). Independent event probabilities multiply, while overlapping event unions require subtracting the intersection. Count carefully before calculating.','For two independent fair coin flips, P(two heads)=1/4. P(at least one head)=1−P(no heads)=3/4.','Independent and mutually exclusive are different. Two nonzero mutually exclusive events cannot be independent.','Two fair coin flips: probability of at least one head?',['1/4','1/2','3/4','1'],2,'The only excluded outcome is TT, with probability 1/4.','probability');
G('03 · Geometry & data','Tables, charts & data interpretation','Read titles, units, axis scales, denominators and time periods before calculating. Distinguish absolute change from percentage change. Combine categories only when their definitions are compatible. Estimate first, then compute to the precision required.','Sales rising from 40 to 50 is an increase of 10 or 25%. A truncated vertical axis can visually exaggerate that change without altering the actual values.','A percentage share can fall while the absolute count rises if the total grows enough.','From 40 to 50, the percentage increase is…',['10%','20%','25%','40%'],2,'The increase 10 divided by the original 40 is .25.','statistics');
G('04 · Verbal reasoning','Reading for structure & main idea','Read for the passage’s purpose and logical structure: claim, evidence, qualification and conclusion. Distinguish the author’s position from a reported view. Summarize each paragraph, then identify how it supports the whole.','A passage that describes an old explanation, presents conflicting evidence and proposes a revision aims to revise that explanation, not merely list facts.','Reject choices that are too broad, too narrow or stronger than the evidence.','A main-idea answer should capture…',['The central point','One striking word','Your outside opinion','Only the first example'],0,'Main idea integrates purpose and scope.');
G('04 · Verbal reasoning','Inference, detail & evidence','A detail question asks what is stated; an inference asks what is supported beyond explicit wording. Anchor both in evidence. Track qualifiers such as some, often and may. A valid inference must be supported, not merely plausible.','“Some trials improved accuracy” supports at least one improvement, not that every trial succeeded. Preserve the passage’s uncertainty in your answer.','Outside knowledge can tempt you away from the text. Do not turn a limited claim into an absolute one.','“Some trials improved” supports…',['All improved','At least one improved','None failed','Most improved'],1,'Some guarantees at least one, but not all or most.');
G('04 · Verbal reasoning','Arguments, assumptions & evaluation','An argument links evidence to a conclusion through assumptions. Identify what must be true for that support to hold. Strengthen and weaken questions alter support without needing to prove or disprove the conclusion completely.','A city says a new bus route caused less traffic. A simultaneous road closure offers an alternative explanation and weakens the causal inference.','Correlation alone does not establish causation. Relevant alternatives matter more than unrelated criticism.','Which weakens the bus-route claim?',['A road closure also reduced traffic','Buses have seats','The route has a name','Traffic is measured daily'],0,'The closure provides another possible cause.');
G('04 · Verbal reasoning','Text Completion: one blank','Read the whole sentence first. Identify signals such as although, because and however. Predict the blank’s rough meaning, then evaluate options in context. Logical fit and tone matter as much as definitions.','“Although the plan looked simple, execution was ___.” Contrast predicts complexity. “Intricate” fits; “effortless” opposes the signal.','Familiarity alone is not evidence that an option fits.','Although the plan looked simple, execution was ___.',['intricate','effortless','identical','briefly'],0,'Although contrasts apparent simplicity with complexity.');
G('04 · Verbal reasoning','Text Completion: multiple blanks','Use constraints across the entire passage. Start with the strongest clue, then check the combination for coherence. Every blank must be correct for credit in this app’s GRE-style scoring.','“Far from being ___, the report was praised for its ___.” The pair obscure / clarity creates a coherent contrast.','A locally plausible choice can make the whole passage inconsistent. Reread all filled blanks together.','Far from obscure, the report was praised for its ___.',['clarity','secrecy','irrelevance','length alone'],0,'Clarity directly opposes obscurity.');
G('04 · Verbal reasoning','Sentence Equivalence: meaning pairs','Choose two options that independently complete the sentence and produce equivalent overall meanings. Predict the missing idea before looking for pairs. Near-synonyms are insufficient if they contradict the sentence’s logic.','“Her ___ response revealed little enthusiasm.” Both tepid and lukewarm fit. Brief is grammatical but does not mean the same thing.','Choose exactly two; a synonym pair can still be wrong in context.','Which pair fits a response showing little enthusiasm?',['enthusiastic and eager','tepid and lukewarm','brief and lengthy','honest and false'],1,'Both words describe low enthusiasm.');
G('04 · Verbal reasoning','Vocabulary in context & word families','Learn definitions, original examples, tone and contrasts. Retrieve a meaning before flipping a card. Use spaced review adjusted to recall. Roots can help but are clues, not guarantees. There is no finite official list that guarantees GRE vocabulary coverage.','“The claim was plausible but unproven” separates seeming reasonable from proven. Contrast plausible with implausible and write your own sentence.','A single translation may miss register or another meaning.','Plausible most nearly means…',['Seemingly reasonable','Proven beyond doubt','Impossible','Very old'],0,'A plausible claim could be true without being demonstrated.');
G('04 · Verbal reasoning','Multi-select, sentence selection & pacing','Some reading questions require all supported choices or a sentence serving a specified role. Assess options independently. Mark a difficult question and return within the section when time allows. Use paragraph structure to relocate evidence.','Two of three statements may be supported; choosing just one is incomplete. For sentence selection, identify the function of each sentence before selecting.','Partly true options may add unsupported clauses. Do not let one difficult item consume the whole section.','For select-all questions, you should…',['Assess each option independently','Always choose one','Pick the longest choices','Use only outside knowledge'],0,'The selected set must include every correct option and no incorrect ones.');
G('05 · Analytical Writing','Analyze an Issue: position & nuance','Develop a reasoned position on the prompt’s actual claim. Define relevant terms, take a stance and qualify it where appropriate. Plan a thesis and supporting reasons before drafting. Nuance should sharpen the argument rather than avoid a position.','For “Schools should prioritize practical skills,” argue when applications deserve priority and when foundational theory is essential. Explain the tradeoff rather than merely saying both matter.','A memorized essay that ignores the task will not serve the argument.','A strong thesis should…',['State a defensible position','Only repeat the prompt','List unrelated words','Avoid every claim'],0,'Readers need to understand your position and its conditions.');
G('05 · Analytical Writing','Evidence, examples & counterarguments','Support reasons with specific examples and explain their relevance. Address a serious objection with a concession, limitation or stronger reasoning. Hypothetical examples can work when clearly identified as hypothetical.','Move from a claim to a concrete case, then explain the mechanism connecting the case to the claim. “This policy helps” needs a how and a why.','Do not invent historical facts or statistics. Name-dropping is weaker than clear analysis.','After an example, you should…',['Explain its connection to the claim','Tell an unrelated story','Repeat the title','Invent a statistic'],0,'Analysis explains why the evidence supports your reasoning.');
G('05 · Analytical Writing','Organization, clarity & revision','Organize paragraphs around reasons. Use transitions to express contrast, consequence or qualification. Reserve time to revise unclear sentences, unsupported jumps and task omissions. Clear language matters more than forced complexity.','A rehearsal might allocate 4 minutes to planning, 22 to drafting and 4 to revision. Adjust through practice. The app saves essays and supplies a self-review checklist.','Word count is not an essay score. This app does not claim official automated GRE grading.','Revision should prioritize…',['Clarity and logical gaps','Only longer words','Only paragraph count','Unverified facts'],0,'Reasoning and clear expression matter more than ornament.');
G('05 · Analytical Writing','Capstone: timed practice & error analysis','Rehearse an issue essay and four reasoning sections. Record raw accuracy, pacing and error categories. Classify misses as concept gaps, reading errors, calculation errors or time choices. Revisit the relevant concept before another timed attempt.','If dividing an inequality by a negative repeatedly causes errors, practice that rule in varied examples. Targeted correction beats repeated tests without review.','Original fixed-form practice is not an ETS adaptive test and does not predict an official scaled score.','After a repeated error, the best step is…',['Diagnose and practice its cause','Ignore explanations','Retake without review','Assume a fixed limit'],0,'Targeted correction turns a result into learning.');

challenge('A friendly greeting','Beginner','Write greet(name) returning "Hello, NAME!" with the supplied name.','def greet(name):\n    pass\n\nprint(greet("Ada"))','assert greet("Ada") == "Hello, Ada!"\nassert greet("Lin") == "Hello, Lin!"\nassert greet("") == "Hello, !"','def greet(name):\n    return f"Hello, {name}!"');
challenge('Even or odd','Beginner','Write is_even(n) returning a boolean. Include zero and negative integers.','def is_even(n):\n    pass','assert is_even(0) is True\nassert is_even(-4) is True\nassert is_even(7) is False','def is_even(n):\n    return n % 2 == 0');
challenge('Running total','Beginner','Write total_to(n) returning 1 + … + n for nonnegative n.','def total_to(n):\n    pass','assert total_to(0) == 0\nassert total_to(5) == 15\nassert total_to(100) == 5050','def total_to(n):\n    return n * (n + 1) // 2');
challenge('Count vowels','Beginner','Write vowels(text) counting a,e,i,o,u, ignoring case.','def vowels(text):\n    pass','assert vowels("Education") == 5\nassert vowels("rhythm") == 0\nassert vowels("AEIOU") == 5','def vowels(text):\n    return sum(c in "aeiou" for c in text.lower())');
challenge('Stable deduplication','Intermediate','Write unique(items) returning unique hashable values in first-seen order.','def unique(items):\n    pass','assert unique([3,1,3,2,1]) == [3,1,2]\nassert unique([]) == []\nassert unique(["a","a","b"]) == ["a","b"]','def unique(items):\n    return list(dict.fromkeys(items))');
challenge('Word frequencies','Intermediate','Write counts(text) returning lowercase word counts split on whitespace.','def counts(text):\n    pass','assert counts("Data data code") == {"data":2,"code":1}\nassert counts("") == {}\nassert counts(" a  b a ") == {"a":2,"b":1}','def counts(text):\n    result = {}\n    for word in text.lower().split():\n        result[word] = result.get(word, 0) + 1\n    return result');
challenge('Safe average','Intermediate','Write average(values). Return the mean; raise ValueError for empty data.','def average(values):\n    pass','assert average([2,4,6]) == 4\nassert average([-2,2]) == 0\ntry:\n    average([])\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError("Empty data must raise ValueError")','def average(values):\n    if not values:\n        raise ValueError("empty data")\n    return sum(values)/len(values)');
challenge('Binary search','Intermediate','Write locate(items,target) for a sorted list of unique integers. Return its index or -1.','def locate(items, target):\n    pass','assert locate([1,3,5,7],5) == 2\nassert locate([1,3,5,7],2) == -1\nassert locate([],1) == -1\nassert locate([4],4) == 0','def locate(items, target):\n    lo,hi=0,len(items)-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if items[mid]==target: return mid\n        if items[mid]<target: lo=mid+1\n        else: hi=mid-1\n    return -1');
challenge('Dot product','Math + Python','Write dot(a,b) for equal-length lists. Empty vectors give 0.','def dot(a, b):\n    pass','assert dot([1,2],[3,4]) == 11\nassert dot([1,0],[0,1]) == 0\nassert dot([],[]) == 0','def dot(a, b):\n    return sum(x*y for x,y in zip(a,b))');
challenge('Population variance','Math + Python','Write variance(values) for nonempty data; divide by n.','def variance(values):\n    pass','assert abs(variance([1,2,3])-2/3)<1e-9\nassert variance([5,5])==0\nassert variance([0,2])==1','def variance(values):\n    mean=sum(values)/len(values)\n    return sum((x-mean)**2 for x in values)/len(values)');
challenge('Mean squared error','Machine Learning','Write mse(actual,predicted) for equal-length nonempty numeric lists.','def mse(actual, predicted):\n    pass','assert mse([1,2],[1,4])==2\nassert mse([3],[3])==0\nassert mse([0,0],[2,2])==4','def mse(actual, predicted):\n    return sum((a-p)**2 for a,p in zip(actual,predicted))/len(actual)');
challenge('One gradient step','Machine Learning','Write step(w,rate) for L(w)=(w−3)^2 using gradient descent.','def step(w, rate):\n    pass','assert abs(step(0,.1)-.6)<1e-9\nassert step(3,.2)==3\nassert abs(step(5,.1)-4.6)<1e-9','def step(w, rate):\n    return w-rate*2*(w-3)');
challenge('Stable softmax','AI Engineering','Write softmax(values) without overflow for inputs such as [1000,1001].','import math\n\ndef softmax(values):\n    pass','assert all(abs(x-.5)<1e-9 for x in softmax([0,0]))\np=softmax([1000,1001])\nassert abs(sum(p)-1)<1e-9\nassert abs(p[1]-.73105857863)<1e-8','import math\ndef softmax(values):\n    top=max(values)\n    exps=[math.exp(x-top) for x in values]\n    return [x/sum(exps) for x in exps]');
challenge('Confusion counts','Machine Learning','Write confusion(actual,predicted) for binary lists, returning (TP,FP,TN,FN).','def confusion(actual, predicted):\n    pass','assert confusion([1,1,0,0],[1,0,1,0])==(1,1,1,1)\nassert confusion([1,1],[1,1])==(2,0,0,0)\nassert confusion([],[])==(0,0,0,0)','def confusion(actual, predicted):\n    tp=fp=tn=fn=0\n    for a,p in zip(actual,predicted):\n        if a==1 and p==1: tp+=1\n        elif a==0 and p==1: fp+=1\n        elif a==0 and p==0: tn+=1\n        else: fn+=1\n    return tp,fp,tn,fn');
challenge('Matrix-vector product','Math + Python','Write matvec(matrix,vector). Every row length matches the vector length.','def matvec(matrix, vector):\n    pass','assert matvec([[1,2],[3,4]],[2,1])==[4,10]\nassert matvec([[2,0],[0,2]],[1,3])==[2,6]\nassert matvec([],[])==[]','def matvec(matrix, vector):\n    return [sum(a*b for a,b in zip(row,vector)) for row in matrix]');
challenge('Breadth-first traversal','Advanced','Write bfs(graph,start) returning BFS discovery order. Neighbors are ordered; handle cycles.','from collections import deque\n\ndef bfs(graph, start):\n    pass','assert bfs({"A":["B","C"],"B":["A","D"],"C":[],"D":[]},"A")==["A","B","C","D"]\nassert bfs({"X":[]},"X")==["X"]','from collections import deque\ndef bfs(graph,start):\n    seen={start}\n    queue=deque([start])\n    result=[]\n    while queue:\n        node=queue.popleft()\n        result.append(node)\n        for nxt in graph.get(node,[]):\n            if nxt not in seen:\n                seen.add(nxt)\n                queue.append(nxt)\n    return result');

P('07 · Advanced Python','Pattern matching & dispatch','Structural pattern matching uses match/case to select behavior based on a value’s structure. Patterns can unpack sequences and mappings, bind names and add guards. For simple equality tests, if or dictionary dispatch may be clearer. Keep fallthrough and the wildcard case explicit.','A case {"type":"move", "x":x, "y":y} recognizes a mapping with those entries and binds coordinates. A guard such as if x >= 0 adds a condition after the structural match.','A bare name in a pattern usually captures a value; it does not compare against an existing variable.','In a pattern, the wildcard _ means…',['Match without binding a name','Raise an error','An empty dictionary','A private class'],0,'The wildcard accepts the matched value without storing it.','trace','command = {"type": "move", "x": 3, "y": 2}\nmatch command:\n    case {"type": "move", "x": x, "y": y}:\n        print(x, y)\n    case _:\n        print("Unknown command")');
P('07 · Advanced Python','Functional tools, sorting & caching','Functions are first-class objects: pass them as arguments, return them and store them. A key function defines how sorting compares records. functools.partial fixes selected arguments, while caching can avoid repeated pure computations. Avoid hidden state when caching because results must depend on the key.','sorted(records,key=lambda r:r[1]) orders records by their second field. Python’s sort is stable: equal keys preserve their relative order. functools.cache memoizes calls with hashable arguments.','Caching a function that reads changing external state can return stale results. A cache can also grow without bounds.','A stable sort preserves…',['Relative order of equal-key items','Every original position','Only descending order','The number of comparisons'],0,'Equal-key records retain their previous order.','sort','from functools import cache\n@cache\ndef fib(n):\n    if n < 2:\n        return n\n    return fib(n-1) + fib(n-2)\nprint(fib(20))\nprint(sorted([("A",2),("B",1)], key=lambda r:r[1]))');
P('07 · Advanced Python','Data model, properties & descriptors','Special methods connect classes to Python operations, including __len__, __iter__, __repr__ and arithmetic methods. A property mediates attribute access with getter or setter logic. Descriptors generalize this through __get__, __set__ and __delete__. Metaclasses customize class creation and are rarely the first tool to reach for.','Implementing __len__ makes len(obj) work. A read-only property can compute a value from internal state without storing a second copy that could become inconsistent.','Special-method contracts matter: __len__ must return a nonnegative integer. Prefer ordinary classes and composition before metaprogramming.','Which method supports len(obj)?',['__len__','__name__','__print__','__size__'],0,'The built-in len uses the object’s length protocol.','memory','class Bag:\n    def __init__(self, items):\n        self.items = list(items)\n    def __len__(self):\n        return len(self.items)\n    @property\n    def empty(self):\n        return len(self) == 0\nb = Bag([1,2])\nprint(len(b), b.empty)');
P('07 · Advanced Python','Profiling, packaging & continuous integration','Profile before optimizing. CPU time, memory and I/O latency are different bottlenecks. A distributable project records metadata and dependencies, commonly in pyproject.toml. Continuous integration runs repeatable checks on changes so failures are caught early. Include tests, type checks and style checks when they protect real contracts.','Use time.perf_counter for elapsed time and cProfile for call-level CPU investigation. Keep a small regression test for each important bug. A clean environment should install the package and run its documented example.','A fast microbenchmark may not improve the real workload. Do not optimize away clear behavior without measured benefit.','Before optimizing a slow program, first…',['Measure the bottleneck','Rewrite every function','Remove all tests','Assume loops are the cause'],0,'Profiling identifies where time or memory is actually being spent.','','from time import perf_counter\nstart = perf_counter()\nresult = sum(x*x for x in range(10000))\nprint(result)\nprint("Elapsed seconds:", perf_counter()-start)');
M('06 · Advanced mathematical tools','More distributions & Bayesian updating','Different distributions encode different assumptions. Poisson counts events under a constant-rate independent-increment model. Exponential waiting times are memoryless. Beta distributions model probabilities on [0,1] and are conjugate to Bernoulli/binomial likelihoods. Choose a family because its assumptions suit the process.','Starting with Beta(2,2), observing 3 successes and 1 failure gives Beta(5,3). Its posterior mean is 5/(5+3)=0.625. This differs from the sample proportion 0.75 because the prior contributes information.','A convenient distribution is not automatically a good fit. Overdispersion or dependence can invalidate a simple Poisson model.','Beta(2,2) plus 3 successes and 1 failure becomes…',['Beta(5,3)','Beta(3,1)','Beta(2,2)','Beta(6,2)'],0,'Add successes to the first shape parameter and failures to the second.','bayes');
M('06 · Advanced mathematical tools','Taylor approximations & numerical gradients','Taylor expansion approximates a smooth function near a point using derivatives. First order gives a tangent approximation; second order adds curvature. Finite differences estimate derivatives from function evaluations and are useful for checking implementations. Step size balances truncation and rounding error.','For f(x)=x² near a, f(a+h)=a²+2ah+h² exactly. A central difference [f(x+h)−f(x−h)]/(2h) often has smaller truncation error than a one-sided difference.','An extremely tiny h can amplify floating-point cancellation. Numerical gradient checks should use tolerances.','The first-order approximation to f(a+h) is…',['f(a)+f′(a)h','f(a)f(h)','f′(a)/h','f(a+h²)'],0,'The tangent model combines the current value with the local slope times the input change.','derivative');
M('06 · Advanced mathematical tools','Tensors, dimensions & geometric intuition','A tensor in array programming is a multidimensional collection with axes whose meanings must be specified. A batch of images may use axes for examples, channels, height and width. Tensor contraction sums over matching indices and generalizes dot products. Broadcasting is separate from contraction.','If X has shape (batch,features) and W has shape (features,outputs), X@W has shape (batch,outputs). The feature axis is contracted; the batch and output axes remain.','A valid shape operation can still be semantically wrong if axes mean different things. Name dimensions in comments and check examples.','(32,10) @ (10,4) produces shape…',['(32,4)','(10,10)','(32,10,4)','Invalid'],0,'The matching dimension 10 is summed over.','matrix');
ML('06 · Advanced learning settings','Semi-supervised, self-supervised & active learning','Semi-supervised learning combines labeled and unlabeled data. Self-supervised learning constructs training targets from data itself, such as masked-token prediction. Active learning chooses examples to label under a limited budget. The methods address different bottlenecks and still require honest evaluation.','A self-supervised encoder can learn from unlabeled text, then be adapted using a smaller labeled set. An active learner might ask for labels near an uncertain boundary, while checking that the query strategy is not biased.','Unlabeled data can come from a different distribution and hurt performance. Pseudo-label errors can reinforce themselves.','Active learning primarily chooses…',['Which examples to label','Only the largest model','The test answers','A graph color'],0,'It tries to spend labeling effort on informative examples.','knn');
ML('06 · Advanced learning settings','Causal inference & controlled experiments','Prediction estimates associations; causal inference asks what changes under intervention. Randomized experiments can reduce confounding when implemented correctly. Observational causal inference requires explicit assumptions about treatment assignment, confounders and measurement. Define the estimand before choosing a method.','People who use a product feature may already be more engaged. Comparing them with nonusers does not isolate the feature’s effect. Random assignment to a feature offer can support a more credible causal estimate.','Controlling for every available variable can introduce bias, especially for variables affected by treatment or collider structures.','Random assignment helps address…',['Confounding in treatment assignment','Every measurement error','All missing outcomes','Any possible implementation bug'],0,'It balances treatment assignment in expectation, though other design problems can remain.','split');
A('06 · Specialization & research','Graph neural networks & relational learning','A graph neural network updates node representations by aggregating information from neighbors. Message passing encodes relationships as well as node attributes. Graph-level and node-level tasks require different evaluation designs. Permutation-aware operations avoid dependence on arbitrary node ordering.','In a molecular graph, atoms are nodes and bonds are edges. A layer can combine a node’s representation with aggregated neighbor messages, then apply a learned transformation.','Splitting edges or nodes naively may leak relationships. Repeated aggregation can also make node representations too similar.','A message-passing layer aggregates…',['Neighbor information','Only filenames','Only a global clock','Independent random labels'],0,'Graph structure determines which representations exchange information.','search');
A('06 · Specialization & research','Research literacy & ablation studies','Read a research claim alongside its assumptions, datasets, baselines, metrics and compute budget. Reproduction tests whether the stated procedure yields similar results. An ablation removes or changes a component to study its contribution. Multiple seeds and uncertainty help distinguish stable gains from noise.','If a new system changes the architecture, data and training budget together, the result does not isolate the architecture’s effect. Controlled ablations hold competing factors comparable.','A benchmark gain does not guarantee usefulness in a different environment. Check contamination, selection effects and unreported costs.','An ablation study helps assess…',['A component’s contribution','Only grammar','Whether every future task is solved','The length of the abstract'],0,'Controlled removal or modification helps attribute changes in measured performance.','split');
G('06 · Advanced practice habits','Sentence selection & answer precision','A sentence-selection item asks which sentence performs a stated role in a passage. Distinguish evidence, a competing explanation, a qualification and a conclusion. Select the exact sentence satisfying the task rather than one that merely mentions the same topic.','If the final sentence says “These results do not establish causation,” it qualifies earlier observations. A preceding sentence reporting the observed association serves a different role.','A familiar phrase does not establish function. Read the surrounding sentences to see how the argument develops.','“These results do not establish causation” most often serves as…',['A qualification of evidence','A direct experimental measurement','A definition of a unit','An unrelated anecdote'],0,'It limits the conclusion warranted by the preceding results.');

function parseNumber(s){s=String(s??'').trim();if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return Number(s);if(/^[+-]?\d+(?:\.\d+)?\s*\/\s*[+-]?\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b===0?NaN:a/b;}return NaN;}
function isCorrect(q,a){if(q.type==='numeric'){let v=parseNumber(a);return Number.isFinite(v)&&Math.abs(v-q.answer)<=1e-5*Math.max(1,Math.abs(q.answer));}if(q.type==='multi')return Array.isArray(a)&&[...a].sort().join(',')===[...q.answer].sort().join(',');if(q.type==='blanks')return Array.isArray(a)&&a.length===q.answer.length&&a.every((v,i)=>v===q.answer[i]);return a===q.answer;}

function axes(yFactor=1,xFactor=1){let s='';for(let x=-5;x<=5;x++){s+=line(sx(x),28,sx(x),390)+txt(sx(x),229,f(x*xFactor,2),'#8c9fbe',12);}for(let y=-4;y<=4;y++){s+=line(32,sy(y),608,sy(y));if(y)s+=txt(305,sy(y)+4,f(y*yFactor,2),'#8c9fbe',12,'end');}return s+line(25,210,615,210,'#637898',1.5)+line(320,25,320,395,'#637898',1.5);}
function pathGraph(fn,xmin=-5.5,xmax=5.5,color=C.a,width=3){let d='';for(let i=0;i<=220;i++){let x=xmin+(xmax-xmin)*i/220,y=fn(x);if(!Number.isFinite(y)){continue;}d+=(d?'L':'M')+f(sx(x))+','+f(sy(Math.max(-100,Math.min(100,y))));}return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}"/>`;}

function erf(x){let sign=x<0?-1:1;x=Math.abs(x);let t=1/(1+.3275911*x);return sign*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x));}
function normalCDF(x){return .5*(1+erf(x/Math.SQRT2));}
function choose(n,k){if(k<0||k>n)return 0;let v=1;for(let i=1;i<=k;i++)v=v*(n-i+1)/i;return v;}

function polyFit(points,degree){let n=degree+1,a=Array.from({length:n},(_,i)=>Array.from({length:n+1},(_,j)=>j===n?points.reduce((s,[x,y])=>s+y*x**i,0):points.reduce((s,[x])=>s+x**(i+j),0)+(i===j?1e-8:0)));for(let k=0;k<n;k++){let best=k;for(let i=k+1;i<n;i++)if(Math.abs(a[i][k])>Math.abs(a[best][k]))best=i;[a[k],a[best]]=[a[best],a[k]];let d=a[k][k];if(Math.abs(d)<1e-14)return Array(n).fill(0);for(let j=k;j<=n;j++)a[k][j]/=d;for(let i=0;i<n;i++)if(i!==k){let m=a[i][k];for(let j=k;j<=n;j++)a[i][j]-=m*a[k][j];}}return a.map(r=>r[n]);}

 }catch(e){self.postMessage({id:m.id,type:'error',text:String(e)});}finally{if(scope)scope.destroy();}
};`;

function stopPython(message='Execution stopped. The next run starts a fresh Python engine.'){if(pyWorker)pyWorker.terminate();pyWorker=null;codeBusy=false;clearTimeout(pyTimer);runChallengeId=null;setOutput(message,true);let st=$('#runtime-status');if(st)st.textContent='Stopped';refreshCodeButtons();}
function runCode(testId=null,trace=false){if(codeBusy)return;const editor=$('#code-editor');if(!editor)return;let code=editor.value,c=CHALLENGES.find(x=>x.id===testId);codeBusy=true;runChallengeId=c?.id||null;setOutput('');codeFrames=[];traceIndex=0;refreshCodeButtons();if(!pyWorker){try{let url=URL.createObjectURL(new Blob([WORKER_SOURCE],{type:'application/javascript'}));pyWorker=new Worker(url);URL.revokeObjectURL(url);}catch(e){stopPython('This browser could not start the Python worker. Download your .py code and run it with desktop Python.');return;}}
const id=++pyRun;pyWorker.onmessage=event=>{let m=event.data;if(m.id!==pyRun)return;if(m.type==='status'){let st=$('#runtime-status');if(st)st.textContent=m.text;if(!codeOutput)setOutput(m.text);}else if(m.type==='executing'){setOutput('');clearTimeout(pyTimer);pyTimer=setTimeout(()=>stopPython('Execution exceeded 10 seconds and was stopped. Check for an infinite loop or reduce the workload.'),10000);}else if(m.type==='output')setOutput(m.text,true);else if(m.type==='done'||m.type==='error'){clearTimeout(pyTimer);codeBusy=false;refreshCodeButtons();let st=$('#runtime-status');if(st)st.textContent=m.type==='error'?'Check the error':'Finished';if(m.type==='error')setOutput(m.text,true);else{if(!codeOutput)setOutput('Finished successfully (no printed output).');if(m.passed&&runChallengeId){state.challenges[runChallengeId]=today();award('code-'+runChallengeId,100);save();}if(m.frames?.length){codeFrames=m.frames;traceIndex=0;if($('#trace-panel'))$('#trace-panel').innerHTML=traceView();}}runChallengeId=null;}};
pyWorker.onerror=event=>{event.preventDefault();stopPython('Python could not load or run. Check your internet connection and whether cdn.jsdelivr.net is allowed. Lessons and visual labs still work offline.');};clearTimeout(pyTimer);pyTimer=setTimeout(()=>stopPython('Python download timed out. Check the connection and try again.'),90000);pyWorker.postMessage({id,code,stdin:$('#stdin')?.value||'',tests:c?.tests||'',trace});}
function practiceHome(){let due=Object.values(state.reviews).filter(r=>r.due<=Date.now()).length;return pageHead('The practice arena','Turn recognition into recall. Every answer includes an explanation.')+`<div class="grid3"><section class="card"><span class="pill">DAILY QUEST</span><h2 style="margin-top:17px">A little of everything</h2><p class="muted">Five questions across your learning paths. New selection each day.</p><button class="btn" data-action="daily">Start daily challenge</button></section><section class="card"><span class="pill orange">${due} DUE</span><h2 style="margin-top:17px">Review queue</h2><p class="muted">Revisit missed questions and ideas scheduled for another retrieval.</p><button class="btn secondary" data-go="review">Open review queue</button></section><section class="card"><span class="pill green">${VOCAB.length} WORDS</span><h2 style="margin-top:17px">Vocabulary deck</h2><p class="muted">Recall the meaning, reveal the card, then rate your recall.</p><button class="btn secondary" data-go="vocab">Open flashcards</button></section></div><h2 class="section-title">Choose your training ground</h2><div class="grid3">${TRACKS.map(t=>`<section class="card"><span class="track-icon" style="--tc:${t.color}">${t.icon}</span><h3 style="margin-top:15px">${t.name}</h3><p class="muted">10 concept questions, worked explanations and an error review.</p><button class="btn secondary" data-action="boss" data-id="${t.id}">Enter boss battle →</button></section>`).join('')}<section class="card"><h3>GRE question drills</h3><p class="muted">Original exam-style questions, including multiple-answer and numeric entry.</p><div class="row wrap"><button class="btn secondary small" data-action="gre-drill" data-id="Quant">Quant</button><button class="btn secondary small" data-action="gre-drill" data-id="Verbal">Verbal</button></div></section></div>`;}
function startPractice(kind,id){let qs,title,key;const seed=Date.now()%1000000;if(kind==='daily'){qs=shuffled(LESSONS,rng(hashString(today()))).slice(0,5).map(l=>LESSON_Q[l.id]);title='Daily challenge';key='daily-'+today();}else if(kind==='boss'){qs=shuffled(LESSONS.filter(l=>l.track===id)).slice(0,10).map(l=>LESSON_Q[l.id]);title=trackOf(id).name+' boss battle';key='boss-'+id+'-'+today();}else if(kind==='review'){qs=Object.values(state.reviews).filter(r=>r.due<=Date.now()).sort((a,b)=>a.due-b.due).slice(0,10).map(r=>r.q);title='Spaced review';key='review-'+today();}else{qs=shuffled(id==='Quant'?quantBank(seed):VERBAL).slice(0,10).map(q=>mixQuestion(q,seed));title='GRE '+id+' drill';key='gre-'+id+'-'+today();}if(!qs.length){toast('Nothing is due yet. Try a new lesson or a practice set.');return;}practice={qs,index:0,results:[],title,key,done:false,started:Date.now()};practiceChoice=null;practiceChecked=false;go('practice/run');}
function scheduleReview(q,correct){let old=state.reviews[q.id],days=correct?Math.min(30,old?.days?old.days*2:1):0;state.reviews[q.id]={q,days,due:Date.now()+(days?days*86400000:5*60000),misses:(old?.misses||0)+(correct?0:1)};save();}
function practiceRun(){if(!practice)return practiceHome();if(practice.done){let score=practice.results.filter(r=>r.correct).length;return pageHead('Battle complete.',`${score} / ${practice.qs.length} correct · ${Math.round(100*score/practice.qs.length)}%`)+`<div class="card"><h2>${score===practice.qs.length?'A clean sweep.':'Every miss gives you a direction.'}</h2><p class="muted">Wrong answers are added to your review queue. Correct answers return at longer intervals.</p><div class="row wrap"><button class="btn" data-go="practice">Choose another challenge</button><button class="btn secondary" data-go="review">Open review queue</button></div></div><h2 class="section-title">Your answer review</h2>${practice.results.map((r,i)=>`<details ${!r.correct?'open':''}><summary>${r.correct?'✓':'↻'} ${i+1}. ${esc(r.q.prompt)}</summary><div><p>Correct: <strong>${esc(answerText(r.q))}</strong></p><p>${esc(r.q.explain)}</p>${r.q.lesson?`<button class="btn ghost" data-go="lesson/${r.q.lesson}">Revisit the lesson →</button>`:''}</div></details>`).join('')}`;}let q=practice.qs[practice.index],correct=practiceChecked&&isCorrect(q,practiceChoice);return pageHead(practice.title,`Question ${practice.index+1} of ${practice.qs.length}`,`<span class="pill">${practice.results.filter(r=>r.correct).length} correct</span>`)+progressBar(100*practice.index/practice.qs.length)+`<div class="card" style="max-width:950px;margin:24px auto"><span class="eyebrow">${esc(q.category)}</span>${questionUI(q,practiceChoice,'practice',practiceChecked)}${practiceChecked?`<div class="feedback ${correct?'':'error'}"><strong>${correct?'Correct.':'Here is the reasoning.'}</strong><p>${esc(q.explain)}</p>${!correct?`<p>Correct answer: <strong>${esc(answerText(q))}</strong></p>`:''}</div><button class="btn" style="margin-top:20px" data-action="practice-next">${practice.index===practice.qs.length-1?'Finish challenge':'Next question →'}</button>`:'<button class="btn" data-action="practice-check">Check answer</button>'}</div>`;}
function reviewView(){let all=Object.values(state.reviews),due=all.filter(r=>r.due<=Date.now());return pageHead('Your review queue',`${due.length} due now · ${all.length} concepts scheduled`,due.length?'<button class="btn" data-action="start-review">Review due questions →</button>':'')+`<div class="card"><p>Incorrect answers return after five minutes. Correct recall schedules another review after 1, 2, 4, 8, 16, then 30 days. Repeated practice can change these intervals.</p>${all.length?`<div class="table-wrap"><table><thead><tr><th>Concept</th><th>Misses</th><th>Next review</th></tr></thead><tbody>${all.sort((a,b)=>a.due-b.due).map(r=>`<tr><td>${esc(r.q.prompt)}</td><td>${r.misses}</td><td>${r.due<=Date.now()?'Due now':new Date(r.due).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>A fresh start.</h3><p class="muted">Complete a lesson check or a practice set to begin your review schedule.</p><button class="btn" data-go="path">Start learning</button></div>'}</div>`;}
function vocabView(){let deck=VOCAB.filter(v=>!state.vocab[v.id]||state.vocab[v.id].due<=Date.now());if(!deck.length)deck=VOCAB;let v=deck[vocabIndex%deck.length],known=Object.values(state.vocab).filter(x=>x.days>=7).length;return pageHead('Words with context.',`${VOCAB.length} original flashcards · ${known} at a 7-day or longer review interval`)+`<div class="grid2 equal"><section class="card flashcard"><span class="eyebrow">CARD ${vocabIndex%deck.length+1} / ${deck.length}</span><div class="word">${v.word}</div>${vocabFlipped?`<p style="font-size:1.15rem;margin-top:17px">${esc(v.meaning)}</p><p class="muted" style="font-family:Georgia,serif">“${esc(v.example)}”</p><div class="row wrap"><button class="btn secondary" data-action="vocab-rate" data-id="${v.id}" data-value="again">Again</button><button class="btn" data-action="vocab-rate" data-id="${v.id}" data-value="good">I recalled it</button></div>`:'<p class="muted" style="margin:18px 0">Recall the meaning before you reveal it.</p><button class="btn" data-action="vocab-reveal">Reveal meaning</button>'}</section><section class="card"><h2>Make the word yours</h2><p>After revealing the card, say a new sentence aloud. Explain how it differs from a nearby word.</p><div class="callout">A useful distinction: <strong>plausible</strong> means seemingly reasonable; <strong>substantiated</strong> means supported with evidence.</div><p class="note">Again schedules a short revisit. Successful recall increases the interval. This is a starter deck, not an exhaustive GRE word list.</p><label for="vocab-search" class="note">Look up a word in this deck</label><input id="vocab-search" class="input" data-input="vocab-search" placeholder="Search word or meaning…"><div id="vocab-results"></div></section></div>`;}
function greHome(){return pageHead('GRE test center','Prepare all three areas: Quantitative Reasoning, Verbal Reasoning and Analytical Writing.')+`<div class="card"><div class="row wrap"><div><span class="pill">FULL REHEARSAL</span><h2 style="margin:13px 0">A complete, timed practice session</h2><p class="muted">1 issue essay · 27 Verbal questions · 27 Quant questions · 118 minutes of section time</p></div><button class="btn" data-action="start-exam" data-id="full">Start full practice →</button></div><p class="note">Original fixed-form practice. It is not section-adaptive, contains a compact reusable question pool, and reports raw accuracy rather than an official GRE scaled score. Analytical Writing uses self-review.</p>${state.exam&&!state.exam.finished?'<div class="callout"><strong>You have a saved session.</strong> Its active section clock keeps running while you leave the page. <button class="btn ghost" data-go="exam">Resume session →</button></div>':''}</div><div class="grid3 section-title"><section class="card"><span class="track-icon">∑</span><h3 style="margin-top:15px">Quant section</h3><p class="muted">12 questions · 21 minutes. Quantitative Comparison, multiple choice, multiple answer and numeric entry.</p><button class="btn secondary" data-action="start-exam" data-id="quant">Start Quant</button></section><section class="card"><span class="track-icon">Aa</span><h3 style="margin-top:15px">Verbal section</h3><p class="muted">12 questions · 18 minutes. Reading, Text Completion and Sentence Equivalence.</p><button class="btn secondary" data-action="start-exam" data-id="verbal">Start Verbal</button></section><section class="card"><span class="track-icon">✎</span><h3 style="margin-top:15px">Writing room</h3><p class="muted">Five original issue prompts, an optional 30-minute timer, autosave and a self-review rubric.</p><button class="btn secondary" data-go="essay/0">Open writing room</button></section></div><div class="grid2 equal"><section class="card"><h2>Section structure</h2><div class="table-wrap"><table><thead><tr><th>Section</th><th>Questions</th><th>Minutes</th></tr></thead><tbody><tr><td>Analytical Writing</td><td>1 essay</td><td>30</td></tr><tr><td>Verbal 1</td><td>12</td><td>18</td></tr><tr><td>Verbal 2</td><td>15</td><td>23</td></tr><tr><td>Quant 1</td><td>12</td><td>21</td></tr><tr><td>Quant 2</td><td>15</td><td>26</td></tr></tbody></table></div><p class="note" style="margin-top:12px">Full practice uses this fixed order. Check <a href="https://www.ets.org/gre/test-takers/general-test/about/content-structure.html" target="_blank" rel="noopener noreferrer">ETS test structure</a> before scheduling the real test.</p></section><section class="card"><h2>Build the foundations</h2><p class="muted">Study arithmetic, algebra, geometry and data analysis. Train reading, vocabulary and argument writing alongside Quant.</p><div class="stack"><button class="btn secondary" data-go="path/gre">Explore the complete GRE path</button><button class="btn secondary" data-go="vocab">Open vocabulary cards</button><button class="btn secondary" data-action="gre-drill" data-id="Quant">Untimed Quant drills</button><button class="btn secondary" data-action="gre-drill" data-id="Verbal">Untimed Verbal drills</button></div></section></div>${state.history.length?`<h2 class="section-title">Recent results</h2><div class="card table-wrap"><table><thead><tr><th>Date</th><th>Practice</th><th>Raw score</th></tr></thead><tbody>${state.history.slice(-8).reverse().map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${esc(h.name)}</td><td>${h.correct}/${h.total}</td></tr>`).join('')}</tbody></table></div>`:''}`;}
const timeText=ms=>{let sec=Math.max(0,Math.ceil(ms/1000));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');};
function newExam(mode){if(state.exam&&!state.exam.finished&&!confirm('Start a new session? This replaces the saved unfinished practice session.'))return;const seed=Date.now()%1000000,qs=shuffled(quantBank(seed),rng(seed)).map(q=>mixQuestion(q,seed)),vs=shuffled(VERBAL,rng(seed+1)).map(q=>mixQuestion(q,seed)),sec=(name,minutes,questions,kind)=>({name,minutes,questions,kind,answers:{},flags:[],submitted:false});let sections=mode==='full'?[sec('Analytical Writing',30,[],'essay'),sec('Verbal 1',18,vs.slice(0,12),'Verbal'),sec('Verbal 2',23,vs.slice(12,27),'Verbal'),sec('Quant 1',21,qs.slice(0,12),'Quant'),sec('Quant 2',26,qs.slice(12,27),'Quant')]:mode==='quant'?[sec('Quant practice',21,qs.slice(0,12),'Quant')]:[sec('Verbal practice',18,vs.slice(0,12),'Verbal')];state.exam={seed,mode,sections,section:0,index:0,started:Date.now(),endAt:Date.now()+sections[0].minutes*60000,finished:false,prompt:seed%ESSAY_PROMPTS.length,essay:''};save();go('exam');}
function examView(){let ex=state.exam;if(!ex)return greHome();if(ex.finished)return examResult();let sec=ex.sections[ex.section];if(sec.submitted)return pageHead('Section saved.',`${sec.name} is complete.`)+`<div class="card"><p>You cannot change answers in a submitted section. This practice rehearsal gives you a transition break before starting the next section.</p><button class="btn" data-action="exam-next-section">Start ${esc(ex.sections[ex.section+1]?.name||'results')} →</button></div>`;let q=sec.questions[ex.index];return pageHead(sec.name,`${ex.mode==='full'?`Section ${ex.section+1} of ${ex.sections.length} · `:''}${sec.kind==='essay'?'Original issue prompt':`Question ${ex.index+1} of ${sec.questions.length}`}`,`<div><span class="note">Time remaining</span><div class="timer" id="exam-timer">${timeText(ex.endAt-Date.now())}</div></div>`)+(sec.kind==='essay'?`<div class="callout">${esc(ESSAY_PROMPTS[ex.prompt])}</div><label for="exam-essay">Your essay</label><textarea id="exam-essay" class="input" style="min-height:460px;margin:12px 0;font-family:Georgia,serif;font-size:1.1rem;line-height:1.8" data-input="exam-essay">${esc(ex.essay)}</textarea><div class="row wrap"><span class="note" id="essay-words">${wordCount(ex.essay)} words · saved on this device</span><button class="btn" data-action="exam-submit">Submit essay section</button></div>`:`<div class="card" style="max-width:980px;margin:auto"><div class="row wrap"><span class="pill">${sec.kind} · ${q.type==='numeric'?'Numeric entry':q.type==='blanks'?'Text Completion':q.type==='multi'?'Multiple answer':'Multiple choice'}</span><button class="btn secondary small" data-action="exam-flag">${sec.flags.includes(ex.index)?'★ Marked for review':'☆ Mark for review'}</button></div><div style="margin-top:20px">${questionUI(q,sec.answers[ex.index],'exam')}</div><div class="row wrap"><button class="btn secondary" data-action="exam-prev" ${ex.index===0?'disabled':''}>← Previous</button><button class="btn" data-action="exam-next" ${ex.index===sec.questions.length-1?'disabled':''}>Next →</button></div><hr><div class="exam-nav" aria-label="Question navigation">${sec.questions.map((_,i)=>`<button class="${answered(sec.questions[i],sec.answers[i])?'answered':''} ${ex.index===i?'current':''} ${sec.flags.includes(i)?'flagged':''}" data-action="exam-jump" data-index="${i}" aria-label="Question ${i+1}${sec.flags.includes(i)?', marked for review':''}">${i+1}</button>`).join('')}</div><details class="${sec.kind==='Quant'?'':'hide'}"><summary>Calculator</summary><div><label for="exam-calculator" class="note">Use +, −, *, / and parentheses</label><input id="exam-calculator" class="input" data-input="calculator" placeholder="(12 + 8) / 5"><output id="calc-result" style="display:block;margin-top:10px;font-family:monospace"></output></div></details><div class="row wrap" style="margin-top:20px"><span class="note">${Object.keys(sec.answers).filter(i=>answered(sec.questions[i],sec.answers[i])).length} / ${sec.questions.length} answered</span><button class="btn secondary" data-action="exam-submit">Submit section</button></div></div>`);}
function answered(q,a){if(q.type==='numeric')return Number.isFinite(parseNumber(a));if(q.type==='multi')return Array.isArray(a)&&a.length>0;if(q.type==='blanks')return Array.isArray(a)&&a.length===q.choices.length&&a.every(v=>Number.isInteger(v)&&v>=0);return Number.isInteger(a)&&a>=0;}
function submitSection(auto=false){let ex=state.exam;if(!ex||ex.finished)return;let sec=ex.sections[ex.section];if(sec.submitted)return;if(!auto&&!confirm('Submit this section? You will not be able to change its answers.'))return;sec.submitted=true;sec.submittedAt=Date.now();if(sec.kind==='essay')state.essays['exam-'+ex.seed]={text:ex.essay,prompt:ex.prompt,updated:Date.now()};if(ex.section===ex.sections.length-1){ex.finished=true;let results=examScores(ex);state.history.push({name:ex.mode==='full'?'Full practice':sec.name,date:Date.now(),correct:results.correct,total:results.total});state.history=state.history.slice(-30);for(let s of ex.sections)for(let [i,q]of s.questions.entries())scheduleReview(q,isCorrect(q,s.answers[i]));award('exam-'+ex.seed,80+results.correct*3);}save();if(auto)toast('Time is up. The section has been submitted.');render();}
function examScores(ex){let correct=0,total=0,by={};for(let s of ex.sections){if(s.kind==='essay')continue;let c=s.questions.filter((q,i)=>isCorrect(q,s.answers[i])).length;correct+=c;total+=s.questions.length;if(!by[s.kind])by[s.kind]={correct:0,total:0};by[s.kind].correct+=c;by[s.kind].total+=s.questions.length;}return{correct,total,by};}
function examResult(){let ex=state.exam,r=examScores(ex);return pageHead('Your practice results',`${r.correct}/${r.total} correct · ${r.total?Math.round(100*r.correct/r.total):0}% raw accuracy`)+`<div class="grid3">${Object.entries(r.by).map(([k,v])=>`<div class="card"><span class="eyebrow">${k}</span><div class="stat-number">${v.correct} / ${v.total}</div>${progressBar(100*v.correct/v.total)}</div>`).join('')}<div class="card"><h3>What this score means</h3><p class="note">Accuracy on this original fixed question set. It is not an official scaled score or a score prediction.</p><button class="btn secondary small" data-go="review">Review your mistakes →</button></div></div>${ex.essay?`<details><summary>Your saved issue essay · ${wordCount(ex.essay)} words</summary><div><p>${esc(ESSAY_PROMPTS[ex.prompt])}</p><p style="white-space:pre-wrap">${esc(ex.essay)}</p>${essayRubric()}</div></details>`:''}<h2 class="section-title">Answer explanations</h2>${ex.sections.filter(s=>s.kind!=='essay').map(s=>`<h3>${s.name}</h3>${s.questions.map((q,i)=>`<details><summary>${isCorrect(q,s.answers[i])?'✓':'↻'} ${i+1}. ${esc(q.prompt)}</summary><div>${q.passage?`<p>${esc(q.passage)}</p>`:''}<p><strong>Correct answer: ${esc(answerText(q))}</strong></p><p>${esc(q.explain)}</p></div></details>`).join('')}`).join('')}<button class="btn" data-go="gre" style="margin-top:20px">Back to the test center</button>`;}
function wordCount(s){return String(s||'').trim()?String(s).trim().split(/\s+/).length:0;}
function essayRubric(){return `<div class="callout"><strong>Self-review, not an automated score</strong><p style="margin:8px 0 0">Check your argument against these questions. Word count does not determine quality.</p></div>${['Did I address the exact task and state a clear position?','Did I qualify my claim where the context requires it?','Did I develop reasons with specific examples and analysis?','Did I address a serious counterargument?','Does each paragraph advance the argument logically?','Is my language clear and controlled, with errors corrected?'].map(s=>`<label class="project-check"><input type="checkbox"><span>${s}</span></label>`).join('')}`;}
function essayView(id){let i=Math.max(0,Math.min(ESSAY_PROMPTS.length-1,parseInt(id)||0)),entry=state.essays[i]||{text:''};return pageHead('The writing room','Make a claim. Support it. Challenge it. Refine it.')+`<div class="grid2"><section class="stack"><div class="card"><label for="essay-prompt" class="note">Choose an original issue prompt</label><select class="input" id="essay-prompt" data-input="essay-prompt">${ESSAY_PROMPTS.map((_,j)=>`<option value="${j}" ${i===j?'selected':''}>Prompt ${j+1}</option>`).join('')}</select><div class="callout">${esc(ESSAY_PROMPTS[i])}</div><div class="row wrap"><button class="btn secondary small" data-action="essay-timer" data-id="${i}">${state.essayTimer?.prompt===i?'Restart 30-minute timer':'Start 30-minute timer'}</button><span class="timer" id="writing-timer">${state.essayTimer?.prompt===i?timeText(state.essayTimer.endAt-Date.now()):'30:00'}</span></div></div><div class="card"><label for="essay-draft">Your essay · autosaved</label><textarea id="essay-draft" class="input" data-input="essay-draft" data-id="${i}" style="min-height:480px;margin-top:12px;font:1.05rem/1.9 Georgia,serif" placeholder="Start with your position and the conditions under which it holds…">${esc(entry.text)}</textarea><div class="row wrap"><small id="essay-words">${wordCount(entry.text)} words</small><button class="btn ghost" data-action="download-essay" data-id="${i}">Download essay ↓</button></div></div></section><aside class="card" style="align-self:start"><h2>Your review rubric</h2>${essayRubric()}<hr><h3>A flexible 30-minute plan</h3><p class="muted">4 minutes to plan, 22 to draft, 4 to revise. Practice and adjust to your own pace.</p><p class="note">When this practice timer ends, you can keep revising. The full rehearsal automatically submits the timed essay section.</p></aside></div>`;}
function projectView(filter){let shown=TRACKS.some(t=>t.id===filter)?PROJECTS.filter(p=>p.track===filter):PROJECTS;return pageHead('Build what you understand.','Ten capstones turn individual concepts into working projects.')+`<div class="filters"><button class="filter ${!filter?'active':''}" data-go="projects">All projects</button>${TRACKS.map(t=>`<button class="filter ${filter===t.id?'active':''}" data-go="projects/${t.id}">${t.name}</button>`).join('')}</div><div class="grid2 equal">${shown.map(p=>{let checks=state.projects[p.id]||[],done=p.steps.filter((_,i)=>checks.includes(i)).length;return `<section class="card"><span class="pill">${trackOf(p.track).name}</span><h2 style="margin-top:15px">${p.title}</h2><p>${p.brief}</p><div class="callout"><strong>Deliverable</strong><br>${p.deliver}</div>${progressBar(100*done/p.steps.length)}${p.steps.map((s,i)=>`<label class="project-check"><input type="checkbox" data-input="project-check" data-id="${p.id}" data-index="${i}" ${checks.includes(i)?'checked':''}><span>${s}</span></label>`).join('')}<p class="note" style="margin:15px 0 0">Self-assessed project checklist · ${done}/${p.steps.length} steps. Completing all steps earns 150 XP once.</p></section>`;}).join('')}</div>`;}

async function importBackup(file){if(!file)return;if(file.size>5000000){toast('Backup is too large. Choose a QuestLab JSON file under 5 MB.');return;}try{let raw=cleanObject(JSON.parse(await file.text()));if(raw.schema!==1||typeof raw.name!=='string'||!Number.isFinite(raw.xp)||raw.xp<0||raw.xp>100000000)throw Error('Invalid QuestLab backup');let objKeys=['awards','completed','labs','challenges','activity','notes','reviews','vocab','drafts','projects','essays'];for(let k of objKeys)if(!raw[k]||typeof raw[k]!=='object'||Array.isArray(raw[k]))throw Error('Missing or invalid '+k);if(!Array.isArray(raw.bookmarks)||!Array.isArray(raw.history))throw Error('Invalid lists');for(let r of Object.values(raw.reviews)){if(!r.q||typeof r.q.prompt!=='string'||!Array.isArray(r.q.choices)||!Number.isFinite(r.due))throw Error('Invalid review record');}if(raw.exam&&(!Array.isArray(raw.exam.sections)||!Number.isInteger(raw.exam.section)||!raw.exam.sections[raw.exam.section]||!Number.isFinite(raw.exam.endAt)))throw Error('Invalid exam record');if(!confirm('Restore this backup? It replaces current progress on this device.'))return;state={...fresh(),...raw,name:raw.name.slice(0,40),goal:[50,100,200,300].includes(raw.goal)?raw.goal:100};save();lessonAttempt={};practice=null;go('progress');toast('Your backup has been restored.');}catch(e){toast('Could not restore backup: '+e.message);}}

function calculate(expr){if(!expr.trim())return '';let clean=expr.replace(/\s+/g,'').replaceAll('×','*').replaceAll('÷','/'),tokens=clean.match(/\d+(?:\.\d*)?|\.\d+|[()+\-*/]/g)||[];if(tokens.join('')!==clean)throw Error();let i=0;function atom(){let t=tokens[i++];if(t==='+'||t==='-'){let v=atom();return t==='-'?-v:v;}if(t==='('){let v=sum();if(tokens[i++]!==')')throw Error();return v;}let v=Number(t);if(t===undefined||!Number.isFinite(v))throw Error();return v;}function product(){let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){let op=tokens[i++],b=atom();v=op==='*'?v*b:v/b;}return v;}function sum(){let v=product();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],b=product();v=op==='+'?v+b:v-b;}return v;}let v=sum();if(i!==tokens.length||!Number.isFinite(v))throw Error();return Number(v.toPrecision(12));}
